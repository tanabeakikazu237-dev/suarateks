    <script>
        // ==========================================
        // INDEXEDDB HYBRID STORAGE LAYER
        // ==========================================
        const DB_NAME = 'SuaraTeksIDViewerDB';
        const DB_VERSION = 1;
        const STORE_NAME = 'sessions';

        function openIndexedDB() {
            return new Promise((resolve, reject) => {
                var request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => resolve(request.result);
                request.onupgradeneeded = (event) => {
                    var db = event.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
            });
        }

        async function dbSaveSession(sessionObj) {
            try {
                var db = await openIndexedDB();
                return new Promise((resolve, reject) => {
                    var transaction = db.transaction(STORE_NAME, 'readwrite');
                    var store = transaction.objectStore(STORE_NAME);
                    var request = store.put(sessionObj);
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                saveToLocalStorageFallback(sessionObj);
            }
        }

        async function dbGetAllSessions() {
            try {
                var db = await openIndexedDB();
                return new Promise((resolve, reject) => {
                    var transaction = db.transaction(STORE_NAME, 'readonly');
                    var store = transaction.objectStore(STORE_NAME);
                    var request = store.getAll();
                    request.onsuccess = () => {
                        var res = request.result || [];
                        res.sort((a, b) => b.timestamp - a.timestamp);
                        resolve(res);
                    };
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                var local = localStorage.getItem('suarateks_history');
                return local ? JSON.parse(local) : [];
            }
        }

        async function dbGetSession(id) {
            try {
                var db = await openIndexedDB();
                return new Promise((resolve, reject) => {
                    var transaction = db.transaction(STORE_NAME, 'readonly');
                    var store = transaction.objectStore(STORE_NAME);
                    var request = store.get(id);
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                var local = localStorage.getItem('suarateks_history');
                var list = local ? JSON.parse(local) : [];
                return list.find(item => item.id === id) || null;
            }
        }

        async function dbDeleteSession(id) {
            try {
                var db = await openIndexedDB();
                return new Promise((resolve, reject) => {
                    var transaction = db.transaction(STORE_NAME, 'readwrite');
                    var store = transaction.objectStore(STORE_NAME);
                    var request = store.delete(id);
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {}
        }

        async function dbClearAll() {
            try {
                var db = await openIndexedDB();
                return new Promise((resolve, reject) => {
                    var transaction = db.transaction(STORE_NAME, 'readwrite');
                    var store = transaction.objectStore(STORE_NAME);
                    var request = store.clear();
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(request.error);
                });
            } catch (e) {
                localStorage.removeItem('suarateks_history');
            }
        }

        function saveToLocalStorageFallback(sessionObj) {
            try {
                var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
                history = history.filter(h => h.id !== sessionObj.id);
                history.unshift(sessionObj);
                if (history.length > 20) history = history.slice(0, 20);
                localStorage.setItem('suarateks_history', JSON.stringify(history));
            } catch (err) {}
        }

        // ==========================================
        // APP STATE & SPEECH SYNTHESIS
        // ==========================================
        window.availableIndoVoices = [];
        window.currentLoadedSessionId = null;
        window.currentLoadedFileName = '';
        window.transcriptBlocks = [];
        window.vocabList = [];
        window.activeMobileTab = 'setup';
        window.activeStudioSubView = 'transcript';
        window.activeVocabMode = 'card';
        window.activeVocabPosFilter = 'all';
        window.activeVocabSearchQuery = '';
        window.currentCardIndex = 0;
        window.isCardFlipped = false;
        window.isShuffled = false;
        window.shuffledVocabList = [];
        window.selectedHistoryIds = [];
        window.speechRate = 0.85;

        window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };

        function initSpeechSynthesisVoices() {
            if (!('speechSynthesis' in window)) return;
            var voices = window.speechSynthesis.getVoices();
            if (voices && voices.length > 0) {
                window.availableIndoVoices = voices.filter(function(v) {
                    var lang = (v.lang || '').toLowerCase();
                    return lang.startsWith('id') || lang.includes('id-id') || lang.includes('indonesian');
                });
            }
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = initSpeechSynthesisVoices;
            initSpeechSynthesisVoices();
        }

        function formatOutputFileName(baseName) {
            var clean = String(baseName || '解析データ').trim().replace(/\.[^/.]+$/, "");
            return clean || '解析データ';
        }

        function setSpeechRate(val) {
            var num = parseFloat(val);
            if (isNaN(num)) num = 0.85;
            window.speechRate = Math.max(0.6, Math.min(1.3, num));
            var display = document.getElementById('speechRateDisplay');
            if (display) display.textContent = window.speechRate.toFixed(2) + 'x';
            var slider = document.getElementById('speechRateSlider');
            if (slider) slider.value = window.speechRate;
        }

        function setFontSize(val) {
            var num = parseInt(val);
            if (isNaN(num)) num = 20;
            num = Math.max(20, Math.min(30, num));
            document.documentElement.style.setProperty('--transcript-font-size', num + 'px');
            document.querySelectorAll('.fontSizeDisplayPt').forEach(function(el) { el.textContent = num + 'pt'; });
            document.querySelectorAll('.fontSizeSlider').forEach(function(el) { el.value = num; });
        }

        function adjustFontSize(delta) {
            var current = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--transcript-font-size')) || 20;
            setFontSize(current + delta);
        }

        function updateActiveSessionBadge() {
            var badge = document.getElementById('activeSessionBadge');
            if (!badge) return;
            if (window.currentLoadedFileName) {
                badge.textContent = '表示中: ' + window.currentLoadedFileName;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        function speakIndonesian(text) {
            if (!('speechSynthesis' in window) || !text) return;
            window.speechSynthesis.cancel();
            if (window.availableIndoVoices.length === 0) initSpeechSynthesisVoices();

            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = window.speechRate || 0.85;

            if (window.availableIndoVoices.length > 0) {
                utterance.voice = window.availableIndoVoices[0];
            } else {
                var voices = window.speechSynthesis.getVoices();
                var indoVoice = voices.find(function(v) { 
                    var lang = (v.lang || '').toLowerCase();
                    return lang.startsWith('id') || lang.includes('id'); 
                });
                if (indoVoice) utterance.voice = indoVoice;
            }
            window.speechSynthesis.speak(utterance);
        }

        function stopAllSpeech() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            if (window.activeSpeechState.blockId) updateBlockToggleUI(window.activeSpeechState.blockId, 'stopped');
            window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };
        }

        function speakFromWord(blockId, wordIndex) {
            var cleanId = blockId.replace(/^[tg]-/, '');
            var block = window.transcriptBlocks.find(function(b) { return b.id === cleanId; });
            if (!block || !block.indonesian) return;
            var words = block.indonesian.split(/\s+/);
            startSpeechBlock(blockId, words.slice(wordIndex).join(' '));
        }

        function toggleSpeechBlock(blockId) {
            if (!('speechSynthesis' in window)) return;
            if (window.activeSpeechState.blockId === blockId) {
                if (window.speechSynthesis.paused || window.activeSpeechState.isPaused) {
                    window.speechSynthesis.resume();
                    window.activeSpeechState.isPaused = false;
                    window.activeSpeechState.isPlaying = true;
                    updateBlockToggleUI(blockId, 'playing');
                } else if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.pause();
                    window.activeSpeechState.isPaused = true;
                    window.activeSpeechState.isPlaying = false;
                    updateBlockToggleUI(blockId, 'paused');
                } else {
                    startSpeechBlock(blockId);
                }
            } else {
                startSpeechBlock(blockId);
            }
        }

        function startSpeechBlock(blockId, customText) {
            if (!('speechSynthesis' in window)) return;
            stopAllSpeech();
            var cleanId = blockId.replace(/^[tg]-/, '');
            var block = window.transcriptBlocks.find(function(b) { return b.id === cleanId; });
            if (!block) return;

            var textToSpeak = customText || block.indonesian;
            if (window.availableIndoVoices.length === 0) initSpeechSynthesisVoices();

            var utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'id-ID';
            utterance.rate = window.speechRate || 0.85;

            if (window.availableIndoVoices.length > 0) {
                utterance.voice = window.availableIndoVoices[0];
            } else {
                var voices = window.speechSynthesis.getVoices();
                var indoVoice = voices.find(function(v) { 
                    var lang = (v.lang || '').toLowerCase();
                    return lang.startsWith('id') || lang.includes('id'); 
                });
                if (indoVoice) utterance.voice = indoVoice;
            }

            utterance.onstart = function() {
                window.activeSpeechState = { blockId: blockId, utterance: utterance, isPlaying: true, isPaused: false };
                updateBlockToggleUI(blockId, 'playing');
            };
            utterance.onpause = function() {
                window.activeSpeechState.isPaused = true;
                window.activeSpeechState.isPlaying = false;
                updateBlockToggleUI(blockId, 'paused');
            };
            utterance.onend = function() {
                updateBlockToggleUI(blockId, 'stopped');
                window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };
            };
            window.speechSynthesis.speak(utterance);
        }

        function updateBlockToggleUI(blockId, state) {
            var btn = document.getElementById('btn-toggle-' + blockId);
            if (!btn) return;
            if (state === 'playing') btn.innerHTML = '<i class="fa-solid fa-pause text-red-500"></i><span>一時停止</span>';
            else if (state === 'paused') btn.innerHTML = '<i class="fa-solid fa-play text-amber-500"></i><span>再開</span>';
            else btn.innerHTML = '<i class="fa-solid fa-play"></i><span>再生</span>';
        }

        function renderClickableIndonesianWords(text, blockId) {
            if (!text) return '';
            var words = text.split(/\s+/);
            return words.map(function(w, idx) {
                return '<span class="word-clickable" onclick="speakFromWord(\'' + blockId + '\', ' + idx + ')" title="ここから再生">' + escapeHtml(w) + '</span>';
            }).join(' ');
        }

        function renderTranscriptContainer() {
            var emptyState = document.getElementById('emptyState');
            var container = document.getElementById('transcriptContainer');
            if (!window.transcriptBlocks || window.transcriptBlocks.length === 0) {
                if (emptyState) emptyState.classList.remove('hidden');
                if (container) container.innerHTML = '';
                return;
            }
            if (emptyState) emptyState.classList.add('hidden');
            var html = '';
            window.transcriptBlocks.forEach(function(block, idx) {
                var clickableIndo = renderClickableIndonesianWords(block.indonesian, 't-' + block.id);
                html += '<div class="bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">' +
                    '<div class="flex items-center justify-between text-xs text-slate-500 pb-1 border-b border-slate-100 dark:border-slate-700">' +
                        '<div class="flex items-center gap-1.5">' +
                            '<span class="font-extrabold text-white bg-red-600 px-2 py-0.5 rounded-md text-[10px]">#' + (idx + 1) + '</span>' +
                            '<span class="font-bold text-red-600 bg-red-50 dark:bg-red-950/60 px-2 py-0.5 rounded-full text-[10px]">' + escapeHtml(block.speaker) + '</span>' +
                        '</div>' +
                        '<button id="btn-toggle-t-' + block.id + '" onclick="toggleSpeechBlock(\'t-' + block.id + '\')" class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-bold transition flex items-center gap-1 hover:bg-slate-200">' +
                            '<i class="fa-solid fa-play text-[10px]"></i><span>再生</span>' +
                        '</button>' +
                    '</div>' +
                    '<p class="dynamic-text-indo font-extrabold text-slate-800 dark:text-slate-100">' + clickableIndo + '</p>' +
                    '<div class="bg-amber-50/70 dark:bg-slate-900/60 p-2.5 rounded-lg border border-amber-200/50">' +
                        '<p class="dynamic-text-ja font-semibold text-amber-950 dark:text-amber-200">' + escapeHtml(block.japanese) + '</p>' +
                    '</div>' +
                '</div>';
            });
            if (container) container.innerHTML = html;
        }

        function renderGrammarContainer() {
            var emptyState = document.getElementById('grammarEmptyState');
            var container = document.getElementById('grammarContainer');
            if (!window.transcriptBlocks || window.transcriptBlocks.length === 0) {
                if (emptyState) emptyState.classList.remove('hidden');
                if (container) container.innerHTML = '';
                return;
            }
            if (emptyState) emptyState.classList.add('hidden');
            var html = '';
            window.transcriptBlocks.forEach(function(block, idx) {
                var clickableIndo = renderClickableIndonesianWords(block.indonesian, 'g-' + block.id);
                html += '<div class="bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2.5">' +
                    '<div class="flex items-center justify-between text-xs pb-1 border-b border-slate-100 dark:border-slate-700">' +
                        '<span class="font-extrabold text-blue-700 bg-blue-100 dark:bg-blue-950/80 px-2.5 py-0.5 rounded-full text-[11px]">文節 #' + (idx + 1) + '</span>' +
                        '<button id="btn-toggle-g-' + block.id + '" onclick="toggleSpeechBlock(\'g-' + block.id + '\')" class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-xs font-bold">' +
                            '<i class="fa-solid fa-play text-[9px]"></i><span>再生</span>' +
                        '</button>' +
                    '</div>' +
                    '<div class="bg-slate-50 dark:bg-slate-900/80 p-2.5 rounded-lg border-l-4 border-blue-500 space-y-1">' +
                        '<p class="dynamic-text-indo font-extrabold text-slate-800 dark:text-slate-100">' + clickableIndo + '</p>' +
                        '<p class="dynamic-text-ja text-slate-500 dark:text-slate-400 font-medium">' + escapeHtml(block.japanese) + '</p>' +
                    '</div>' +
                    '<div class="bg-blue-50/60 dark:bg-blue-950/30 p-3 rounded-lg border border-blue-200/60 text-xs leading-relaxed text-blue-950 dark:text-blue-200 space-y-1.5">' +
                        '<h5 class="font-bold text-blue-700 dark:text-blue-400 flex items-center gap-1 text-[10px] uppercase tracking-wider"><i class="fa-solid fa-diagram-project"></i> 4段階精密構文解剖・応用解説</h5>' +
                        '<div class="dynamic-text-ja whitespace-pre-line font-medium pt-0.5 leading-relaxed">' + escapeHtml(block.grammarExplanation || '解析データなし') + '</div>' +
                    '</div>' +
                '</div>';
            });
            if (container) container.innerHTML = html;
        }

        function highlightMatch(str, query) {
            var safeStr = escapeHtml(str || '');
            var q = (query || '').trim();
            if (!q) return safeStr;
            try {
                var escQuery = q.replace(/[.*+?^${}()|[\]\]/g, '\\$&');
                return safeStr.replace(new RegExp('(' + escQuery + ')', 'gi'), '<mark class="search-highlight">$1</mark>');
            } catch (e) { return safeStr; }
        }

        function getFilteredVocabList() {
            var filtered = window.isShuffled ? Array.from(window.shuffledVocabList) : (window.vocabList || []);
            if (window.activeVocabPosFilter !== 'all') {
                filtered = filtered.filter(function(v) { return v.pos === window.activeVocabPosFilter; });
            }
            var query = (window.activeVocabSearchQuery || '').trim().toLowerCase();
            if (query !== '') {
                filtered = filtered.filter(function(v) {
                    return (v.indonesian || '').toLowerCase().includes(query) || (v.japanese || '').toLowerCase().includes(query) || (v.baseForm || '').toLowerCase().includes(query);
                });
            }
            return filtered;
        }

        function renderVocabContainer() {
            var emptyState = document.getElementById('vocabEmptyState');
            var listContainer = document.getElementById('vocabListContainer');
            var cardContainer = document.getElementById('vocabCardContainer');
            var vocabBadge = document.getElementById('vocabCountBadge');

            var filtered = getFilteredVocabList();
            if (vocabBadge) vocabBadge.textContent = (window.vocabList || []).length;
            updatePosFilterUI();
            updateModeBtnUI();

            if (!filtered || filtered.length === 0) {
                if (emptyState) emptyState.classList.remove('hidden');
                if (listContainer) listContainer.innerHTML = '';
                if (cardContainer) cardContainer.classList.add('hidden');
                return;
            }

            if (emptyState) emptyState.classList.add('hidden');
            if (window.activeVocabMode === 'list') {
                if (cardContainer) cardContainer.classList.add('hidden');
                if (listContainer) listContainer.classList.remove('hidden');

                var html = '', q = window.activeVocabSearchQuery;
                filtered.forEach(function(v) {
                    var hIndo = highlightMatch(v.indonesian, q);
                    var hJap = highlightMatch(v.japanese, q);
                    var keyTag = v.isKeyWord ? '<span class="text-[9px] font-extrabold px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border border-amber-300/50 flex items-center gap-0.5 shrink-0"><i class="fa-solid fa-star text-[8px]"></i>重要</span>' : '';

                    html += '<div class="bg-white dark:bg-slate-800 p-3 rounded-lg border border-slate-200 dark:border-slate-700 shadow-sm flex items-center justify-between gap-2">' +
                        '<div class="space-y-0.5 flex-1 min-w-0">' +
                            '<div class="flex items-center gap-1.5 flex-wrap">' +
                                '<span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 shrink-0">' + getPosLabel(v.pos) + '</span>' +
                                keyTag +
                                '<h4 class="dynamic-text-indo font-extrabold text-slate-800 dark:text-slate-100 truncate">' + hIndo + '</h4>' +
                                '<button onclick="speakIndonesian(\'' + escapeHtml(v.indonesian) + '\')" class="text-slate-400 hover:text-emerald-500 p-1 shrink-0"><i class="fa-solid fa-volume-high text-xs"></i></button>' +
                            '</div>' +
                            '<p class="dynamic-text-ja text-emerald-700 dark:text-emerald-400 font-bold">' + hJap + '</p>' +
                        '</div>' +
                        '<button onclick="toggleVocabMastered(\'' + v.id + '\')" class="px-2 py-1 rounded ' + (v.mastered ? 'bg-emerald-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-400') + ' text-[10px] font-bold shrink-0">' + (v.mastered ? '習得' : '未修') + '</button>' +
                    '</div>';
                });
                if (listContainer) listContainer.innerHTML = html;
            } else {
                if (listContainer) listContainer.classList.add('hidden');
                if (cardContainer) { cardContainer.classList.remove('hidden'); cardContainer.classList.add('flex'); }
                updateFlashcardUI();
            }
        }

        function getPosLabel(pos) {
            switch(pos) {
                case 'noun': return '名詞';
                case 'verb': return '動詞';
                case 'adjective': return '形容詞';
                case 'adverb': return '副詞';
                default: return 'その他';
            }
        }

        function updateModeBtnUI() {
            var btnCard = document.getElementById('btnModeCard'), btnList = document.getElementById('btnModeList');
            if (btnCard && btnList) {
                if (window.activeVocabMode === 'card') {
                    btnCard.className = "px-3 py-1.5 text-xs font-extrabold rounded-lg bg-red-600 text-white shadow transition";
                    btnList.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition";
                } else {
                    btnList.className = "px-3 py-1.5 text-xs font-extrabold rounded-lg bg-red-600 text-white shadow transition";
                    btnCard.className = "px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition";
                }
            }
        }

        function updatePosFilterUI() {
            document.querySelectorAll('.btn-pos-filter').forEach(function(btn) {
                if (btn.dataset.pos === window.activeVocabPosFilter) {
                    btn.className = "btn-pos-filter px-2.5 py-1 rounded-lg text-[11px] font-extrabold bg-red-600 text-white shadow-xs transition";
                } else {
                    btn.className = "btn-pos-filter px-2.5 py-1 rounded-lg text-[11px] font-bold bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition";
                }
            });
        }

        function setVocabMode(mode) { window.activeVocabMode = mode; renderVocabContainer(); }
        function setVocabPosFilter(pos) { window.activeVocabPosFilter = pos; window.currentCardIndex = 0; renderVocabContainer(); }
        function toggleShuffleCards() {
            window.isShuffled = !window.isShuffled;
            if (window.isShuffled) window.shuffledVocabList = Array.from(window.vocabList).sort(function() { return Math.random() - 0.5; });
            window.currentCardIndex = 0;
            renderVocabContainer();
        }
        function toggleVocabMastered(id) {
            var item = window.vocabList.find(function(v) { return v.id === id; });
            if (item) { item.mastered = !item.mastered; renderVocabContainer(); }
        }

        function updateFlashcardUI() {
            var filtered = getFilteredVocabList();
            if (!filtered || filtered.length === 0) return;
            if (window.currentCardIndex >= filtered.length) window.currentCardIndex = 0;

            var item = filtered[window.currentCardIndex];
            var q = window.activeVocabSearchQuery;
            var cardIndo = document.getElementById('cardIndoText');
            var cardJap = document.getElementById('cardJapText');
            var cardContext = document.getElementById('cardContextFull');
            var cardPosFront = document.getElementById('cardBadgeFront');
            var cardPosBack = document.getElementById('cardPosBack');
            var progressLabel = document.getElementById('flashcardProgressLabel');

            if (cardIndo) cardIndo.innerHTML = highlightMatch(item.indonesian, q);
            if (cardJap) cardJap.innerHTML = highlightMatch(item.japanese, q);
            if (cardContext) cardContext.innerHTML = item.context ? ('文脈: \"' + highlightMatch(item.context, q) + '\"') : '文脈なし';
            if (cardPosFront) cardPosFront.innerHTML = getPosLabel(item.pos) + (item.isKeyWord ? ' <span class="ml-1 px-1.5 py-0.5 bg-amber-500 text-white rounded text-[9px] font-extrabold"><i class="fa-solid fa-star text-[8px]"></i> 重要語</span>' : '');
            if (cardPosBack) cardPosBack.innerHTML = '品詞: ' + getPosLabel(item.pos) + (item.baseForm ? (' (原形: ' + item.baseForm + ')') : '');
            if (progressLabel) progressLabel.textContent = (window.currentCardIndex + 1) + ' / ' + filtered.length;

            window.isCardFlipped = false;
            var flashcardInner = document.getElementById('flashcardInner');
            if (flashcardInner) flashcardInner.classList.remove('rotate-y-180');
        }

        function flipFlashcard() {
            window.isCardFlipped = !window.isCardFlipped;
            var inner = document.getElementById('flashcardInner');
            if (window.isCardFlipped) inner.classList.add('rotate-y-180');
            else inner.classList.remove('rotate-y-180');
        }

        function nextFlashcard(mastered) {
            var filtered = getFilteredVocabList();
            if (filtered.length === 0) return;
            if (mastered && filtered[window.currentCardIndex]) filtered[window.currentCardIndex].mastered = true;
            window.currentCardIndex = (window.currentCardIndex + 1) % filtered.length;
            updateFlashcardUI();
        }

        async function loadHistoryFromStorage() {
            try {
                var history = await dbGetAllSessions();
                renderHistoryList(history);
            } catch (e) { renderHistoryList([]); }
        }

        function toggleHistorySelect(id, event) {
            if (event) event.stopPropagation();
            var idx = window.selectedHistoryIds.indexOf(id);
            if (idx > -1) window.selectedHistoryIds.splice(idx, 1);
            else window.selectedHistoryIds.push(id);
            updateHistoryActionButtonsState();
        }

        function updateHistoryActionButtonsState() {
            var btnMerge = document.getElementById('btnMergeSelected');
            var btnSave = document.getElementById('btnSaveSelected');
            var count = window.selectedHistoryIds.length;

            if (btnMerge) {
                if (count >= 2) {
                    btnMerge.disabled = false;

                    btnMerge.innerHTML = '<i class="fa-solid fa-code-merge"></i> 結合 (' + count + ')';
                } else {
                    btnMerge.disabled = true;
                    btnMerge.className = "px-1.5 py-0.5 bg-slate-200 text-slate-400 rounded text-[9px] font-bold transition flex items-center gap-1 cursor-not-allowed opacity-60 shrink-0 whitespace-nowrap";
                    btnMerge.innerHTML = '<i class="fa-solid fa-code-merge"></i> 結合';
                }
            }

            if (btnSave) {
                if (count >= 1) {
                    btnSave.disabled = false;
                    btnSave.className = "px-1.5 py-0.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[9px] font-bold shadow transition flex items-center gap-1 cursor-pointer shrink-0 whitespace-nowrap";
                    btnSave.innerHTML = '<i class="fa-solid fa-download"></i> 保存 (' + count + ')';

                    btnSave.disabled = true;

                    btnSave.innerHTML = '<i class="fa-solid fa-download"></i> 保存';
                }
            }
        }

        function renderHistoryList(history) {
            var container = document.getElementById('historyList');
            if (!container) return;
            if (!history || history.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 py-1.5 text-center">履歴なし (IndexedDB)</p>';
                window.selectedHistoryIds = [];
                updateHistoryActionButtonsState();
                return;
            }
            var html = '';
            history.forEach(function(item) {
                var isChecked = window.selectedHistoryIds.includes(item.id);
                var isCurrent = window.currentLoadedSessionId === item.id;
                html += '<div onclick="loadHistoryItem(\'' + item.id + '\')" class="p-1.5 rounded-lg ' + (isCurrent ? 'bg-red-50 dark:bg-red-950/40 border-red-300' : 'bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700') + ' border hover:bg-red-50 cursor-pointer flex justify-between items-center text-xs transition mb-1">' +
                    '<div class="flex items-center gap-1.5 min-w-0 flex-1">' +
                        '<input type="checkbox" ' + (isChecked ? 'checked' : '') + ' onclick="toggleHistorySelect(\'' + item.id + '\', event)" class="rounded text-red-600 cursor-pointer shrink-0 w-3.5 h-3.5">' +
                        '<div class="min-w-0 flex-1">' +
                            '<p class="font-bold text-slate-800 dark:text-slate-100 truncate leading-tight text-[11px]">' + escapeHtml(item.fileName) + '</p>' +
                            '<p class="text-[8px] text-slate-400 font-mono">' + escapeHtml(item.date) + '</p>' +
                        '</div>' +
                    '</div>' +
                    '<button onclick="deleteHistoryItem(\'' + item.id + '\', event)" class="text-slate-400 hover:text-rose-500 p-1 shrink-0 ml-1"><i class="fa-solid fa-trash-can text-[10px]"></i></button>' +
                '</div>';
            });
            container.innerHTML = html;
            updateHistoryActionButtonsState();
        }

        async function saveSelectedHistories() {
            if (!window.selectedHistoryIds || window.selectedHistoryIds.length === 0) return;
            var allSessions = await dbGetAllSessions();
            var selectedItems = window.selectedHistoryIds.map(function(id) {
                return allSessions.find(function(h) { return h.id === id; });
            }).filter(Boolean);

            if (selectedItems.length === 0) return;

            selectedItems.forEach(function(item, index) {
                var cleanName = formatOutputFileName(item.fileName || '解析データ');
                var exportObj = {
                    id: item.id,
                    fileName: cleanName,
                    date: item.date,
                    blocks: item.blocks || [],
                    vocab: item.vocab || []
                };
                setTimeout(function() {
                    exportDataToFile(exportObj, cleanName + '.json');
                }, index * 300);
            });
            showToast(selectedItems.length + ' 件の履歴を個別JSONとして保存しました！', 'info');
        }

        async function mergeSelectedHistories() {
            if (window.selectedHistoryIds.length < 2) return;
            var allSessions = await dbGetAllSessions();
            var selectedItems = window.selectedHistoryIds.map(function(id) {
                return allSessions.find(function(h) { return h.id === id; });
            }).filter(Boolean);

            var mergedBlocks = [], mergedVocabMap = new Map(), titleParts = [];
            var globalBlockIdx = 0;

            selectedItems.forEach(function(item) {
                titleParts.push(item.fileName.replace(/\.[^/.]+$/, ""));
                if (Array.isArray(item.blocks)) {
                    item.blocks.forEach(function(b) {
                        mergedBlocks.push(Object.assign({}, b, { id: 'block-merged-' + Date.now() + '-' + globalBlockIdx, blockIndex: globalBlockIdx }));
                        globalBlockIdx++;
                    });
                }
                if (Array.isArray(item.vocab)) {
                    item.vocab.forEach(function(v) {
                        var key = (v.indonesian || '').trim().toLowerCase();
                        if (key && !mergedVocabMap.has(key)) mergedVocabMap.set(key, v);
                    });
                }
            });

            var mergedTitle = formatOutputFileName('結合_' + titleParts.join('_').substring(0, 20));
            window.currentLoadedSessionId = 'session-merged-' + Date.now();
            window.currentLoadedFileName = mergedTitle;
            window.transcriptBlocks = mergedBlocks;
            window.vocabList = Array.from(mergedVocabMap.values());
            updateActiveSessionBadge();
            renderTranscriptContainer();
            renderGrammarContainer();
            renderVocabContainer();

            var mergedDataObj = {
                id: window.currentLoadedSessionId,
                fileName: mergedTitle,
                date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now(),
                blocks: window.transcriptBlocks,
                vocab: window.vocabList
            };
            await dbSaveSession(mergedDataObj);
            var history = await dbGetAllSessions();
            renderHistoryList(history);

            exportDataToFile(mergedDataObj, mergedTitle + '.json');
            window.selectedHistoryIds = [];
            showToast('選択した履歴を結合しました！', 'info');
        }

        async function clearHistory() {
            await dbClearAll();
            window.selectedHistoryIds = [];
            renderHistoryList([]);
            showToast('IndexedDB履歴をすべて消去しました', 'info');
        }

        async function loadHistoryItem(id) {
            var found = await dbGetSession(id);
            if (found) {
                window.currentLoadedSessionId = found.id;
                window.currentLoadedFileName = found.fileName || '';
                window.transcriptBlocks = found.blocks || [];
                window.vocabList = found.vocab || [];
                updateActiveSessionBadge();
                renderTranscriptContainer();
                renderGrammarContainer();
                renderVocabContainer();
                var history = await dbGetAllSessions();
                renderHistoryList(history);
                showToast('「' + found.fileName + '」を読み込みました', 'info');
                if (window.innerWidth < 768) switchMobileTab('transcript');
            }
        }

        async function deleteHistoryItem(id, event) {
            if (event) event.stopPropagation();
            await dbDeleteSession(id);
            window.selectedHistoryIds = window.selectedHistoryIds.filter(function(sid) { return sid !== id; });
            var history = await dbGetAllSessions();
            renderHistoryList(history);
            showToast('履歴から削除しました', 'info');
        }

        function exportDataToFile(dataObj, customFilename) {
            var blob = new Blob([JSON.stringify(dataObj, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = customFilename || 'suarateks_backup.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        async function importHistoryBackup(event) {
            var files = event.target.files ? Array.from(event.target.files) : [];
            if (files.length === 0) return;

            var successCount = 0, lastLoadedData = null;

            for (var i = 0; i < files.length; i++) {
                try {
                    var content = await new Promise(function(resolve, reject) {
                        var reader = new FileReader();
                        reader.onload = function(e) { resolve(e.target.result); };
                        reader.onerror = reject;
                        reader.readAsText(files[i]);
                    });
                    var importedData = JSON.parse(content);
                    var singleObj = Array.isArray(importedData) ? importedData[0] : importedData;
                    if (!singleObj || !singleObj.blocks) continue;

                    var formattedName = formatOutputFileName(singleObj.fileName || files[i].name);
                    var item = {
                        id: singleObj.id || ('session-imported-' + Date.now() + '-' + i),
                        fileName: formattedName,
                        date: singleObj.date || new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                        timestamp: Date.now(),
                        blocks: singleObj.blocks,
                        vocab: singleObj.vocab || []
                    };
                    await dbSaveSession(item);
                    lastLoadedData = item;
                    successCount++;
                } catch (e) {}
            }

            var history = await dbGetAllSessions();
            renderHistoryList(history);

            if (lastLoadedData) {
                window.currentLoadedSessionId = lastLoadedData.id;
                window.currentLoadedFileName = lastLoadedData.fileName;
                window.transcriptBlocks = lastLoadedData.blocks;
                window.vocabList = lastLoadedData.vocab;
                updateActiveSessionBadge();
                renderTranscriptContainer();
                renderGrammarContainer();
                renderVocabContainer();
            }
            showToast(successCount + ' 件のJSONを読み込みました！', 'info');
            event.target.value = '';
        }

        function showToast(message, type) {
            if (type === undefined) type = 'info';
            var container = document.getElementById('toastContainer');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = (type === 'error' ? 'bg-rose-600' : 'bg-slate-800') + ' text-white px-3.5 py-2.5 rounded-xl shadow-xl text-xs font-bold flex items-center justify-between gap-2 transition-all duration-300 pointer-events-auto border border-white/10';
            toast.innerHTML = '<span>' + escapeHtml(message) + '</span>';
            container.appendChild(toast);
            setTimeout(function() { if (toast.parentElement) toast.remove(); }, 4000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function switchMobileTab(tab) {
            window.activeMobileTab = tab;
            var panelSetup = document.getElementById('panelSetup');
            var panelTranscript = document.getElementById('panelTranscript');

            if (window.innerWidth >= 768) {
                if (panelSetup) panelSetup.style.display = 'flex';
                if (panelTranscript) panelTranscript.style.display = 'flex';
                return;
            }

            if (tab === 'setup') {
                if (panelSetup) panelSetup.style.display = 'flex';
                if (panelTranscript) panelTranscript.style.display = 'none';
            } else {
                if (panelSetup) panelSetup.style.display = 'none';
                if (panelTranscript) panelTranscript.style.display = 'flex';
                setStudioSubView(tab);
            }
        }

        function setStudioSubView(subView) {
            window.activeStudioSubView = subView;
            var viewTranscript = document.getElementById('transcriptView');
            var viewGrammar = document.getElementById('grammarView');
            var viewVocab = document.getElementById('vocabView');

            var btnTranscript = document.getElementById('navTabTranscript');
            var btnGrammar = document.getElementById('navTabGrammar');
            var btnVocab = document.getElementById('navTabVocab');

            if (viewTranscript) viewTranscript.classList.add('hidden');
            if (viewGrammar) viewGrammar.classList.add('hidden');
            if (viewVocab) { viewVocab.classList.add('hidden'); viewVocab.classList.remove('flex'); }

            [btnTranscript, btnGrammar, btnVocab].forEach(function(btn) {
                if (btn) btn.className = "no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition flex items-center gap-1 shrink-0";
            });

            if (subView === 'transcript') {
                if (viewTranscript) viewTranscript.classList.remove('hidden');
                if (btnTranscript) btnTranscript.className = "no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-extrabold bg-red-600 text-white shadow-md transition flex items-center gap-1 shrink-0";
            } else if (subView === 'grammar') {
                if (viewGrammar) viewGrammar.classList.remove('hidden');
                if (btnGrammar) btnGrammar.className = "no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-extrabold bg-red-600 text-white shadow-md transition flex items-center gap-1 shrink-0";
                renderGrammarContainer();
            } else if (subView === 'vocab') {
                if (viewVocab) { viewVocab.classList.remove('hidden'); viewVocab.classList.add('flex'); }
                if (btnVocab) btnVocab.className = "no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-extrabold bg-red-600 text-white shadow-md transition flex items-center gap-1 shrink-0";
                renderVocabContainer();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            setFontSize(20);
            setSpeechRate(0.85);
            loadHistoryFromStorage();
            if ('speechSynthesis' in window) initSpeechSynthesisVoices();
        });
    </script>
</body>
</html>
