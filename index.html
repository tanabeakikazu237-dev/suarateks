<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuaraTeks ID Pro</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SuaraTeks">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    },
                    colors: {
                        indoRed: {
                            500: '#E70011',
                            600: '#C8000F',
                            700: '#A0000C'
                        }
                    }
                }
            }
        };
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --transcript-font-size: 20px;
        }

        .dynamic-text-indo {
            font-size: var(--transcript-font-size, 20px);
            line-height: 1.4;
        }

        .dynamic-text-ja {
            font-size: calc(var(--transcript-font-size, 20px) * 0.75);
            line-height: 1.4;
        }

        .perspective-1000 {
            perspective: 1000px;
        }

        .transform-style-3d {
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .backface-hidden {
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .rotate-y-180 {
            transform: rotateY(180deg);
        }

        .word-clickable {
            cursor: pointer;
            border-bottom: 1.5px dotted #94a3b8;
            transition: all 0.15s;
            display: inline-block;
        }

        .word-clickable:hover {
            color: #e70011;
            border-bottom-color: #e70011;
            background-color: rgba(231, 0, 17, 0.08);
            border-radius: 2px;
        }

        .search-highlight {
            background-color: #fef08a;
            color: #854d0e;
            font-weight: bold;
            padding: 0 2px;
            border-radius: 2px;
        }

        .dropzone-active {
            border-color: #e70011 !important;
            background-color: rgba(231, 0, 17, 0.05) !important;
        }

        .no-wrap-tab {
            white-space: nowrap !important;
            word-break: keep-all !important;
            flex-shrink: 0 !important;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-[100dvh] flex flex-col font-sans overflow-hidden">

    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-2 flex items-center justify-between shrink-0">
        <h1 class="font-extrabold text-sm">
            SuaraTeks<span class="text-red-600">ID</span> Pro
        </h1>

        <button
            onclick="openModal('apiKeyModal')"
            class="px-2.5 py-1 bg-amber-100 text-amber-900 rounded-lg text-xs font-bold">
            API Key
        </button>
    </header>

    <div class="md:hidden bg-slate-200 dark:bg-slate-800 p-1 flex items-center gap-1 shrink-0 border-b border-slate-300 dark:border-slate-700 text-xs font-bold">
        <button
            onclick="switchMobileTab('setup')"
            class="flex-1 py-1.5 text-center bg-white dark:bg-slate-700 rounded shadow-sm">
            設定・音源
        </button>

        <button
            onclick="switchMobileTab('transcript')"
            class="flex-1 py-1.5 text-center">
            本文
        </button>

        <button
            onclick="switchMobileTab('vocab')"
            class="flex-1 py-1.5 text-center">
            単語帳
        </button>
    </div>

    <div class="flex-1 flex overflow-hidden p-2 sm:p-3 gap-3 max-w-7xl mx-auto w-full">

        <!-- =========================
             SETUP PANEL
        ========================== -->
        <div id="panelSetup" class="w-full md:w-72 flex flex-col gap-3 shrink-0 overflow-y-auto">

            <div id="playerCard"
                 class="bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">

                <h3 class="font-extrabold text-xs text-slate-700 dark:text-slate-200 flex items-center justify-between">
                    <span class="flex items-center gap-1.5">
                        <i class="fa-solid fa-layer-group text-red-600"></i>
                        音源キュー選択
                    </span>

                    <span class="text-[10px] text-slate-400">
                        最大10件
                    </span>
                </h3>

                <label id="fileDropLabel" for="audioFileInput" class="relative group cursor-pointer block">

                    <input
                        type="file"
                        id="audioFileInput"
                        accept="audio/*"
                        multiple
                        onchange="window.handleFileChange(event)"
                        class="hidden">

                    <div class="border-2 border-dashed border-slate-300 dark:border-slate-700 hover:border-red-500 rounded-xl p-3 text-center bg-slate-50 dark:bg-slate-900 transition-all duration-200 group-hover:bg-red-50/30">

                        <div id="dropzoneDefault" class="space-y-1">

                            <div class="w-8 h-8 mx-auto rounded-full bg-red-100 dark:bg-red-950/60 flex items-center justify-center text-red-600 group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                            </div>

                            <p class="text-xs font-extrabold text-slate-700 dark:text-slate-200">
                                複数音源を選択（最大10件）
                            </p>

                            <p class="text-[9px] text-slate-400">
                                ドラッグ＆ドロップ対応
                            </p>
                        </div>

                        <div id="dropzoneSelected" class="hidden space-y-1 text-left">

                            <div class="flex items-center justify-between text-emerald-600 mb-1">
                                <span class="text-[10px] font-extrabold">
                                    <i class="fa-solid fa-list-check"></i>
                                    キューセット完了
                                </span>

                                <span class="text-[9px] text-slate-400">
                                    タップで再選択
                                </span>
                            </div>

                            <div id="queueListContainer" class="max-h-36 overflow-y-auto pr-1"></div>
                        </div>

                    </div>
                </label>

                <button
                    id="startTranscribeBtn"
                    onclick="window.processAudioWithGemini()"
                    class="w-full py-2 bg-red-600 hover:bg-red-700 text-white rounded-lg text-xs font-extrabold shadow transition">

                    <span id="transcribeBtnText">
                        順次シリアル解析を開始
                    </span>
                </button>
            </div>

            <!-- Progress -->
            <div id="chunkProgressContainer"
                 class="hidden bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">

                <div class="flex justify-between text-xs font-bold">
                    <span id="chunkProgressLabel">
                        順次解析実行中...
                    </span>

                    <span id="chunkProgressPercent" class="text-red-600">
                        0%
                    </span>
                </div>

                <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2 overflow-hidden">
                    <div id="chunkProgressBar"
                         class="bg-red-600 h-2 rounded-full w-0 transition-all">
                    </div>
                </div>
            </div>

            <!-- History -->
            <div class="bg-white dark:bg-slate-800 p-3 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm flex-1 flex flex-col min-h-[160px]">

                <div class="flex items-center justify-between pb-1.5 border-b border-slate-100 dark:border-slate-700 mb-2 gap-1">

                    <h4 class="font-extrabold text-xs text-slate-700 dark:text-slate-200 flex items-center gap-1">
                        <i class="fa-solid fa-clock-rotate-left text-amber-500"></i>
                        解析履歴
                    </h4>

                    <div class="flex items-center gap-1">

                        <button
                            id="btnMergeSelected"
                            disabled
                            onclick="mergeSelectedHistories()"
                            class="px-2 py-0.5 bg-slate-200 text-slate-400 rounded text-[10px] font-bold transition flex items-center gap-1 opacity-60">

                            <i class="fa-solid fa-code-merge"></i>
                            選択結合
                        </button>

                        <button
                            onclick="manualSaveHistory()"
                            class="px-1.5 py-0.5 bg-emerald-100 hover:bg-emerald-200 text-emerald-800 rounded text-[10px] font-bold transition"
                            title="現在の解析結果を個別JSONとして保存">
                            保存
                        </button>

                        <button
                            onclick="clearHistory()"
                            class="px-1.5 py-0.5 bg-slate-100 hover:bg-rose-100 text-slate-500 hover:text-rose-600 rounded text-[10px] font-bold transition">
                            消去
                        </button>

                    </div>
                </div>

                <div id="historyList" class="space-y-1 flex-1 overflow-y-auto"></div>

                <div class="pt-2 border-t border-slate-100 dark:border-slate-700 mt-1">

                    <label class="w-full py-1 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded text-[10px] font-bold flex items-center justify-center gap-1 cursor-pointer">

                        <i class="fa-solid fa-file-import"></i>
                        JSONバックアップから復元

                        <input
                            type="file"
                            accept=".json"
                            onchange="importHistoryBackup(event)"
                            class="hidden">
                    </label>
                </div>
            </div>
        </div>

        <!-- =========================
             MAIN PANEL
        ========================== -->
        <div id="panelTranscript"
             class="hidden md:flex flex-1 flex-col bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 overflow-hidden shadow-sm">

            <!-- Navigation -->
            <div class="bg-white dark:bg-slate-800 px-2 sm:px-3 py-2 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between gap-2 shrink-0 overflow-x-auto hide-scrollbar">

                <div class="flex items-center gap-1 bg-slate-100 dark:bg-slate-900 p-1 rounded-xl shrink-0 overflow-x-auto hide-scrollbar max-w-full">

                    <button
                        id="navTabTranscript"
                        onclick="setStudioSubView('transcript')"
                        class="no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-extrabold bg-red-600 text-white shadow-md transition flex items-center gap-1 shrink-0">

                        <i class="fa-solid fa-align-left text-[11px]"></i>
                        本文
                    </button>

                    <button
                        id="navTabGrammar"
                        onclick="setStudioSubView('grammar')"
                        class="no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition flex items-center gap-1 shrink-0">

                        <i class="fa-solid fa-diagram-project text-[11px]"></i>
                        文法解剖
                    </button>

                    <button
                        id="navTabVocab"
                        onclick="setStudioSubView('vocab')"
                        class="no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition flex items-center gap-1 shrink-0">

                        <i class="fa-solid fa-book-open text-[11px]"></i>
                        単語帳 (<span id="vocabCountBadge">0</span>)
                    </button>

                </div>

                <!-- Font -->
                <div class="flex items-center gap-1.5 bg-slate-100 dark:bg-slate-900 px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 shrink-0">

                    <span class="text-[10px] font-extrabold text-slate-500 shrink-0">
                        文字
                    </span>

                    <button
                        onclick="adjustFontSize(-1)"
                        class="w-4 h-4 flex items-center justify-center rounded bg-white dark:bg-slate-700 text-slate-700 font-bold hover:bg-slate-200 text-xs shrink-0">
                        -
                    </button>

                    <input
                        type="range"
                        id="fontSizeSlider"
                        min="20"
                        max="30"
                        value="20"
                        oninput="setFontSize(this.value)"
                        class="w-12 accent-red-600 cursor-pointer shrink-0">

                    <button
                        onclick="adjustFontSize(1)"
                        class="w-4 h-4 flex items-center justify-center rounded bg-white dark:bg-slate-700 text-slate-700 font-bold hover:bg-slate-200 text-xs shrink-0">
                        +
                    </button>

                    <span
                        id="fontSizeDisplayPt"
                        class="text-[10px] font-black text-red-600 w-7 text-right shrink-0">
                        20pt
                    </span>
                </div>
            </div>

            <!-- Transcript -->
            <div id="transcriptView" class="flex-1 p-3 overflow-y-auto space-y-3">

                <div id="emptyState"
                     class="h-full flex items-center justify-center text-xs text-slate-400 font-bold">

                    音源キューをセットして「順次シリアル解析を開始」を押してください
                </div>

                <div id="transcriptContainer" class="space-y-3"></div>
            </div>

            <!-- Grammar -->
            <div id="grammarView" class="hidden flex-1 p-3 overflow-y-auto space-y-3">

                <div id="grammarEmptyState"
                     class="h-full flex items-center justify-center text-xs text-slate-400 font-bold">

                    文法解剖データがありません
                </div>

                <div id="grammarContainer" class="space-y-3"></div>
            </div>

            <!-- Vocabulary -->
            <div id="vocabView" class="hidden flex-1 flex-col overflow-hidden p-3 space-y-3">

                <div class="bg-white dark:bg-slate-800 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 space-y-2 shrink-0">

                    <div class="flex items-center gap-2">

                        <input
                            type="text"
                            id="vocabSearchInput"
                            oninput="window.activeVocabSearchQuery=this.value; renderVocabContainer();"
                            placeholder="検索..."
                            class="flex-1 px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-xs font-bold">

                        <button
                            id="btnModeCard"
                            onclick="setVocabMode('card')"
                            class="px-3 py-1.5 text-xs font-extrabold rounded-lg bg-red-600 text-white shadow transition">
                            カード
                        </button>

                        <button
                            id="btnModeList"
                            onclick="setVocabMode('list')"
                            class="px-3 py-1.5 text-xs font-bold rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition">
                            一覧
                        </button>

                    </div>

                    <div class="flex items-center gap-1 flex-wrap text-[10px] font-bold">

                        <button
                            data-pos="all"
                            onclick="setVocabPosFilter('all')"
                            class="btn-pos-filter px-2.5 py-1 rounded-lg bg-red-600 text-white">
                            すべて
                        </button>

                        <button
                            data-pos="noun"
                            onclick="setVocabPosFilter('noun')"
                            class="btn-pos-filter px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600">
                            名詞
                        </button>

                        <button
                            data-pos="verb"
                            onclick="setVocabPosFilter('verb')"
                            class="btn-pos-filter px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600">
                            動詞
                        </button>

                        <button
                            data-pos="adjective"
                            onclick="setVocabPosFilter('adjective')"
                            class="btn-pos-filter px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600">
                            形容詞
                        </button>

                        <button
                            data-pos="adverb"
                            onclick="setVocabPosFilter('adverb')"
                            class="btn-pos-filter px-2.5 py-1 rounded-lg bg-slate-100 text-slate-600">
                            副詞
                        </button>

                    </div>
                </div>

                <div id="vocabEmptyState"
                     class="h-full flex items-center justify-center text-xs text-slate-400 font-bold">
                    単語データがありません
                </div>

                <div id="vocabListContainer"
                     class="hidden flex-1 overflow-y-auto space-y-2"></div>

                <div id="vocabCardContainer"
                     class="hidden flex-1 flex-col items-center justify-center p-2">

                    <div class="w-full max-w-sm flex justify-between text-xs font-bold text-slate-500 mb-2">

                        <span id="flashcardProgressLabel">
                            1 / 1
                        </span>

                        <button
                            onclick="toggleShuffleCards()"
                            class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-[11px]">

                            <i class="fa-solid fa-shuffle"></i>
                            シャッフル
                        </button>
                    </div>

                    <div
                        onclick="flipFlashcard()"
                        class="w-full max-w-sm h-60 perspective-1000 cursor-pointer">

                        <div
                            id="flashcardInner"
                            class="relative w-full h-full transform-style-3d shadow-lg rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800">

                            <!-- Front -->
                            <div class="absolute inset-0 w-full h-full backface-hidden p-5 flex flex-col justify-between rounded-2xl bg-white dark:bg-slate-800">

                                <span
                                    id="cardBadgeFront"
                                    class="self-start text-[10px] font-bold px-2 py-0.5 rounded bg-red-100 text-red-700 dark:bg-red-950 dark:text-red-300">
                                    品詞
                                </span>

                                <div class="text-center space-y-2">

                                    <h2
                                        id="cardIndoText"
                                        class="text-2xl font-black text-slate-800 dark:text-slate-100">
                                        ---
                                    </h2>

                                    <p class="text-xs text-slate-400">
                                        タップして裏面を表示
                                    </p>
                                </div>

                                <div class="text-right">

                                    <button
                                        onclick="event.stopPropagation(); speakIndonesian(document.getElementById('cardIndoText').textContent)"
                                        class="p-2 text-slate-400 hover:text-emerald-500">

                                        <i class="fa-solid fa-volume-high text-base"></i>
                                    </button>

                                </div>
                            </div>

                            <!-- Back -->
                            <div class="absolute inset-0 w-full h-full backface-hidden rotate-y-180 p-5 flex flex-col justify-between rounded-2xl bg-emerald-50/60 dark:bg-slate-900 border-2 border-emerald-500">

                                <span
                                    id="cardPosBack"
                                    class="self-start text-[10px] font-bold text-emerald-800 dark:text-emerald-300">
                                    品詞詳細
                                </span>

                                <div class="text-center space-y-2">

                                    <h3
                                        id="cardJapText"
                                        class="text-xl font-extrabold text-emerald-800 dark:text-emerald-300">
                                        ---
                                    </h3>

                                    <p
                                        id="cardContextFull"
                                        class="text-xs text-slate-600 dark:text-slate-400 italic">
                                        ---
                                    </p>
                                </div>

                                <div class="text-right">

                                    <button
                                        onclick="event.stopPropagation(); speakIndonesian(document.getElementById('cardIndoText').textContent)"
                                        class="p-2 text-slate-400 hover:text-emerald-500">

                                        <i class="fa-solid fa-volume-high text-base"></i>
                                    </button>

                                </div>
                            </div>

                        </div>
                    </div>

                    <div class="flex gap-3 mt-4 w-full max-w-sm">

                        <button
                            onclick="nextFlashcard(false)"
                            class="flex-1 py-2 bg-slate-200 text-slate-700 rounded-xl text-xs font-bold">
                            要復習
                        </button>

                        <button
                            onclick="nextFlashcard(true)"
                            class="flex-1 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold shadow">
                            習得済み
                        </button>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- =========================
         API KEY MODAL
    ========================== -->
    <div
        id="apiKeyModal"
        class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center p-4 z-50">

        <div class="bg-white dark:bg-slate-800 rounded-xl p-4 max-w-sm w-full space-y-3 shadow-xl">

            <h3 class="font-bold text-sm">
                Gemini API Key 設定
            </h3>

            <p class="text-[10px] text-slate-400">
                Google AI Studio で取得した API Key を入力してください
            </p>

            <input
                type="password"
                id="apiKeyInput"
                placeholder="AIzaSy..."
                class="w-full px-3 py-2 rounded border text-xs dark:bg-slate-900 font-mono">

            <div class="flex justify-end gap-2">

                <button
                    onclick="closeModal('apiKeyModal')"
                    class="px-3 py-1 text-xs">
                    キャンセル
                </button>

                <button
                    onclick="saveApiKeyFromModal()"
                    class="px-3 py-1 bg-red-600 text-white rounded text-xs font-bold">
                    保存
                </button>

            </div>
        </div>
    </div>

<script>
/* =========================================================
   GLOBAL STATE
========================================================= */

window.fileQueue = [];
window.isQueueProcessing = false;
window.currentLoadedFile = null;
window.currentAudioBase64 = null;

window.transcriptBlocks = [];
window.vocabList = [];

window.activeMobileTab = 'setup';
window.activeStudioSubView = 'transcript';

window.activeVocabMode = 'card';
window.activeVocabPosFilter = 'all';
window.activeVocabSearchQuery = '';

window.currentCardIndex = 0;
window.isCardFlipped = false;
window.isShuffled = false;
window.shuffledVocabList = [];

window.selectedHistoryIds = [];

window.activeSpeechState = {
    blockId: null,
    utterance: null,
    isPlaying: false,
    isPaused: false
};

/*
 * Gemini model
 *
 * 405修正とは別に、将来モデルを変更するときは
 * この1箇所を変更すればOK。
 */
var GEMINI_MODEL = 'gemini-2.5-flash';

var sleep = function(ms) {
    return new Promise(function(resolve) {
        setTimeout(resolve, ms);
    });
};


/* =========================================================
   JSON UTILITIES
========================================================= */

function stripJsonCodeFence(text) {
    return String(text || '')
        .trim()
        .replace(/^```json\s*/i, '')
        .replace(/^```\s*/i, '')
        .replace(/\s*```$/i, '')
        .trim();
}

function safeParseTruncatedJson(jsonString) {

    var str = stripJsonCodeFence(jsonString);

    if (!str) {
        throw new Error('GeminiからJSONが返されませんでした');
    }

    /*
     * 通常のJSON
     */
    try {
        return JSON.parse(str);
    } catch (e) {
        console.warn('[Gemini JSON] 通常解析失敗。修復を試みます...', e);
    }

    /*
     * JSON配列が途中で切れた場合
     */
    if (str[0] === '[') {

        var lastObjectEnd = -1;
        var objectDepth = 0;
        var inString = false;
        var escaped = false;

        for (var j = 0; j < str.length; j++) {

            var c = str[j];

            if (inString) {

                if (escaped) {
                    escaped = false;
                } else if (c === '\\') {
                    escaped = true;
                } else if (c === '"') {
                    inString = false;
                }

                continue;
            }

            if (c === '"') {
                inString = true;
                continue;
            }

            if (c === '{') {
                objectDepth++;
            } else if (c === '}') {

                objectDepth = Math.max(0, objectDepth - 1);

                if (objectDepth === 0) {
                    lastObjectEnd = j;
                }
            }
        }

        if (lastObjectEnd !== -1) {

            var repairedArray =
                str
                    .substring(0, lastObjectEnd + 1)
                    .replace(/,\s*$/, '') +
                ']';

            try {
                return JSON.parse(repairedArray);
            } catch (err) {
                console.warn('[Gemini JSON] 配列修復失敗', err);
            }
        }
    }

    throw new Error(
        'GeminiのJSON応答を解析できませんでした'
    );
}

window.handleFileChange = function(event) {

    var input =
        (event && event.target)
            ? event.target
            : document.getElementById('audioFileInput');

    var files = input ? input.files : null;

    if (!files || files.length === 0) {

    }

    processSelectedFiles(Array.from(files));

function processSelectedFiles(files) {

    var validFiles = files.filter(function(f) {

        var type = String(f.type || '').toLowerCase();
        var name = String(f.name || '').toLowerCase();

        return (
            type.startsWith('audio/') ||
            /\.(mp3|wav|m4a|aac|ogg|flac)$/i.test(name)
        );

    }).slice(0, 10);

    if (validFiles.length === 0) {

        showToast(
            '音声ファイルが選択されていません',
            'error'
        );

        return;
    }

    /*
     * 現在の仕様では、再選択するとキューを置き換える。
     */
    window.fileQueue = validFiles.map(function(f, idx) {

        return {
            id: 'queue-' + Date.now() + '-' + idx,
            file: f,
            status: 'waiting',
            progress: 0,
            error: ''
        };

    });

    renderQueueUI();

    showToast(
        window.fileQueue.length +
        ' 件の音源をキューに追加しました！',
        'info'
    );
}

function formatBytes(bytes) {

    bytes = Number(bytes) || 0;

    if (bytes === 0) {
        return '0 Bytes';
    }

    var k = 1024;

    var sizes = [
        'Bytes',
        'KB',
        'MB',
        'GB',
        'TB'
    ];

    var i = Math.floor(
        Math.log(bytes) / Math.log(k)
    );

    i = Math.max(
        0,
        Math.min(i, sizes.length - 1)
    );

    return (
        parseFloat(
            (bytes / Math.pow(k, i)).toFixed(1)
        ) +
        ' ' +
        sizes[i]
    );
}


function initDropzoneEvents() {

    var label =
        document.getElementById('fileDropLabel');

    if (!label) {
        return;
    }

    ['dragenter', 'dragover'].forEach(function(eventName) {

        label.addEventListener(
            eventName,
            function(e) {

                e.preventDefault();
                e.stopPropagation();

                label.classList.add(
                    'dropzone-active'
                );
            },
            false
        );

    });

    ['dragleave', 'drop'].forEach(function(eventName) {

        label.addEventListener(
            eventName,
            function(e) {

                e.preventDefault();
                e.stopPropagation();

                label.classList.remove(
                    'dropzone-active'
                );
            },
            false
        );

    });

    label.addEventListener(
        'drop',
        function(e) {

            var dt = e.dataTransfer;
            var files = dt ? dt.files : null;

            if (files && files.length > 0) {
                processSelectedFiles(
                    Array.from(files)
                );
            }
        },
        false
    );
}

   AUDIO MIME TYPE
========================================================= */

function getAudioMimeType(file) {

    if (file && file.type) {
        return file.type;
    }

    var name =
        String(file && file.name || '')
            .toLowerCase();

    if (name.endsWith('.mp3')) {
        return 'audio/mpeg';
    }

    if (name.endsWith('.wav')) {
        return 'audio/wav';
    }

    if (name.endsWith('.m4a')) {
        return 'audio/mp4';
    }

    if (name.endsWith('.aac')) {
        return 'audio/aac';
    }

    if (name.endsWith('.ogg')) {
        return 'audio/ogg';
    }

    if (name.endsWith('.flac')) {
        return 'audio/flac';
    }

    return 'audio/mpeg';
}


/* =========================================================
   GEMINI API
========================================================= */

/*
 * ★★★ ここが今回の最重要修正 ★★★
 *
 * 元コード:
 *
 * var targetUrl = '[https://...](https://...)' + cleanKey;
 *
 * ↑ Markdown が JavaScript に混入していた。
 *
 * 修正版では完全なURLを普通の文字列として生成し、
 * API Keyは x-goog-api-key ヘッダーで送る。
 */

async function fetchGeminiApi(apiKey, payload) {

    var cleanKey =
        String(
            apiKey ||
            getApiKey() ||
            ''
        ).trim();

    if (!cleanKey || cleanKey.length < 20) {

        throw new Error(
            'API Keyが正しく設定されていません。「API Key」ボタンから再設定してください。'
        );
    }

    if (
        !payload ||
        typeof payload !== 'object'
    ) {

        throw new Error(
            'Gemini APIに送信するデータが不正です。'
        );
    }

    if (!payload.generationConfig) {
        payload.generationConfig = {};
    }

    payload.generationConfig.temperature = 0.1;

    /*
     * ★ 正しい Gemini API endpoint
     */
    var targetUrl =
        'https://generativelanguage.googleapis.com/v1beta/models/' +
        GEMINI_MODEL +
        ':generateContent';

    var response = null;

    for (
        var attempt = 1;
        attempt <= 3;
        attempt++
    ) {

        try {

            response = await fetch(
                targetUrl,
                {
                    method: 'POST',

                    headers: {
                        'Content-Type': 'application/json',
                        'x-goog-api-key': cleanKey
                    },

                    body: JSON.stringify(payload)
                }
            );

            /*
             * Rate Limit
             */
            if (
                response.status === 429 &&
                attempt < 3
            ) {

                console.warn(
                    'Gemini API 429。' +
                    attempt +
                    '回目のリトライを行います。'
                );

                await sleep(
                    attempt * 2000
                );

                continue;
            }

            break;

        } catch (networkError) {

            console.error(
                'Gemini Network Error:',
                networkError
            );

            if (attempt >= 3) {

                throw new Error(
                    'Gemini APIへの接続に失敗しました: ' +
                    networkError.message
                );
            }

            await sleep(
                attempt * 1000
            );
        }
    }

    if (!response) {

        throw new Error(
            'Gemini APIからレスポンスを取得できませんでした。'
        );
    }

    var responseText =
        await response.text();

    console.log(
        'Gemini HTTP Status:',
        response.status
    );

    /*
     * JSON解析
     */
    var data;

    try {

        data = JSON.parse(
            responseText
        );

    } catch (err) {

        console.error(
            'Gemini Raw Response:',
            responseText
        );

        throw new Error(
            'Gemini APIからJSONではない応答が返りました ' +
            '(HTTP ' +
            response.status +
            ')'
        );
    }

    /*
     * APIエラー
     */
    if (
        !response.ok ||
        data.error
    ) {

        console.error(
            'Gemini API Error:',
            data
        );

        var apiMessage =
            data &&
            data.error &&
            data.error.message
                ? data.error.message
                : 'HTTP Error ' +
                  response.status;

        throw new Error(
            'Gemini API Error (' +
            response.status +
            '): ' +
            apiMessage
        );
    }

    return data;
}


/* =========================================================
   GEMINI RESPONSE EXTRACTION
========================================================= */

function extractGeminiText(data) {

    var candidate =
        data &&
        data.candidates &&
        data.candidates[0];

    if (!candidate) {

        var reason =
            data &&
            data.promptFeedback &&
            data.promptFeedback.blockReason;

        if (reason) {

            throw new Error(
                'Geminiによりブロックされました: ' +
                reason
            );
        }

        throw new Error(
            'Geminiの候補応答がありません。'
        );
    }

    var parts =
        candidate.content &&
        candidate.content.parts;

    if (!Array.isArray(parts)) {

        throw new Error(
            'Gemini応答にテキストデータがありません。'
        );
    }

    var text =
        parts
            .map(function(p) {
                return p && p.text
                    ? p.text
                    : '';
            })
            .join('')
            .trim();

    if (!text) {

        throw new Error(
            'Geminiが空の応答を返しました。'
        );
    }

    return text;
}

window.processAudioWithGemini = async function() {

        );

        openModal(
            'apiKeyModal'
        );

    }

    if (window.isQueueProcessing) {

    }

    window.isQueueProcessing = true;

    var btn =

        document.getElementById(

        );

        document.getElementById(

        item.status = 'processing';
        item.error = '';

        if (btnText) {

                '/' +

        try {

            await processSingleFileInQueue(
                item,
                apiKey,
                i + 1,
                window.fileQueue.length
            );

            item.status = 'completed';

            successCount++;

            renderQueueUI();

        } catch (err) {

            console.error(
                'Single File Queue Process Error:',
                err
            );

            item.status = 'error';

            item.error =
                err && err.message
                    ? err.message
                    : String(err);

            errorCount++;

            renderQueueUI();

            showToast(
                '「' +
                item.file.name +
                '」のエラー: ' +
                item.error,

            );

    if (btn) {
        btn.disabled = false;
    }

    if (btnText) {
        btnText.textContent =
            '全ファイルの順次解析を開始';
    }

        showToast(

        );

    } else {

            successCount +
            '件 / 失敗 ' +
            errorCount +
            '件',
            'error'
        );
    }

    setTimeout(
        function() {

            if (progressContainer) {
                progressContainer.classList.add(
                    'hidden'
                );
            }

        },
        1000
    );
};

async function processSingleFileInQueue(

        file;

     */
    var base64Data =
        await new Promise(
            function(resolve, reject) {

                var reader =
                    new FileReader();

                reader.onload =
                    function(e) {

                        try {

                            var result =
                                String(
                                    e.target.result ||
                                    ''
                                );

                            var commaIndex =
                                result.indexOf(',');

                            if (commaIndex === -1) {

                                reject(
                                    new Error(
                                        '音声ファイルの読み込みに失敗しました'
                                    )
                                );

                                return;
                            }

                            resolve(
                                result.substring(
                                    commaIndex + 1
                                )
                            );

                        } catch (err) {

                            reject(err);
                        }
                    };

                reader.onerror =
                    function() {

                        reject(
                            new Error(
                                '音声ファイルの読み込みに失敗しました'

/* =========================================================

========================================================= */

async function enrichGrammarInBatches(
    apiKey,
    currentIdx,
    totalIdx
) {

    if (
        !window.transcriptBlocks ||
        window.transcriptBlocks.length === 0
    ) {
        return;
    }

    var batchSize = 5;

    var totalBlocks =
        window.transcriptBlocks.length;

    for (
        var i = 0;
        i < totalBlocks;
        i += batchSize
    ) {

        var chunk =
            window.transcriptBlocks.slice(
                i,
                i + batchSize
            );

        var inputBlocks =
            chunk.map(
                function(b) {

                    return {
                        blockIndex:
                            b.blockIndex,

                        indonesian:
                            b.indonesian
                    };
                }
            );

        var grammarPrompt =
`Analyze each Indonesian phrase below for a Japanese learner.

Explain:
- sentence structure
- important grammar
- particles / affixes
- nuance
- useful application example

Return ONLY a valid JSON array.

[
  {
    "blockIndex": 0,
    "grammarExplanation": "【構造】...\\n【ポイント】...\\n【例文】..."
  }
]

INPUT:
${JSON.stringify(inputBlocks)}`;

        try {

            var payload = {

                contents: [
                    {
                        parts: [
                            {
                                text:
                                    grammarPrompt
                            }
                        ]
                    }
                ],

                generationConfig: {
                    responseMimeType:
                        'application/json',

                    temperature:
                        0.1,

                    maxOutputTokens:
                        4096
                }
            };

            var data =
                await fetchGeminiApi(
                    apiKey,
                    payload
                );

            var text =
                extractGeminiText(
                    data
                );

            var parsed =
                safeParseTruncatedJson(
                    text
                );

            if (Array.isArray(parsed)) {

                parsed.forEach(
                    function(item) {

                        var block =
                            window.transcriptBlocks.find(
                                function(b) {

                                    return (
                                        b.blockIndex ===
                                        Number(
                                            item.blockIndex
                                        )
                                    );
                                }
                            );

                        if (
                            block &&
                            item.grammarExplanation
                        ) {

                            block.grammarExplanation =
                                String(
                                    item.grammarExplanation
                                ).trim();
                        }
                    }
                );
            }

        } catch (e) {

            console.warn(
                'Grammar batch warning',
                e
            );
        }

        await sleep(500);
    }
}


/* =========================================================
   VOCABULARY
========================================================= */

async function extractAllVocabInBatches(
    apiKey,
    currentIdx,
    totalIdx
) {

    if (
        !window.transcriptBlocks ||
        window.transcriptBlocks.length === 0
    ) {
        return;
    }

    var batchSize = 5;

    var allExtractedVocabMap =
        new Map();

    var totalBlocks =
        window.transcriptBlocks.length;

    for (
        var i = 0;
        i < totalBlocks;
        i += batchSize
    ) {

        var chunk =
            window.transcriptBlocks.slice(
                i,
                i + batchSize
            );

        var chunkText =
            chunk
                .map(function(b) {
                    return b.indonesian;
                })
                .join(' ');

        var vocabPrompt =
`Extract useful and unique Indonesian vocabulary from this text.

Return ONLY a valid JSON array.

[
  {
    "indonesian": "spoken word",
    "baseForm": "root word",
    "japanese": "Japanese meaning",
    "pos": "noun",
    "context": "Short phrase context"
  }
]

Allowed pos values:
noun
verb
adjective
adverb
other

Rules:
- JSON only
- No Markdown
- No code fence
- Do not duplicate the same word
- Prefer useful vocabulary for Japanese learners

Text:
${chunkText}`;

        try {

            var vocabPayload = {

                contents: [
                    {
                        parts: [
                            {
                                text:
                                    vocabPrompt
                            }
                        ]
                    }
                ],

                generationConfig: {
                    responseMimeType:
                        'application/json',

                    temperature:
                        0.1,

                    maxOutputTokens:
                        4096
                }
            };

            var data =
                await fetchGeminiApi(
                    apiKey,
                    vocabPayload
                );

            var text =
                extractGeminiText(
                    data
                );

            var parsed =
                safeParseTruncatedJson(
                    text
                );

            if (Array.isArray(parsed)) {

                parsed.forEach(
                    function(v) {

                        var key =
                            String(
                                v.indonesian ||
                                ''
                            )
                            .trim()
                            .toLowerCase();

                        if (
                            key &&
                            !allExtractedVocabMap.has(key)
                        ) {

                            var pos =
                                [
                                    'noun',
                                    'verb',
                                    'adjective',
                                    'adverb',
                                    'other'
                                ].includes(
                                    v.pos
                                )
                                    ? v.pos
                                    : 'other';

                            allExtractedVocabMap.set(
                                key,
                                {
                                    id:
                                        'vocab-' +
                                        Date.now() +
                                        '-' +
                                        allExtractedVocabMap.size,

                                    indonesian:
                                        String(
                                            v.indonesian ||
                                            ''
                                        ),

                                    baseForm:
                                        String(
                                            v.baseForm ||
                                            v.indonesian ||
                                            ''
                                        ),

                                    japanese:
                                        String(
                                            v.japanese ||
                                            ''
                                        ),

                                    pos:
                                        pos,

                                    context:
                                        String(
                                            v.context ||
                                            ''
                                        ),

                                    mastered:
                                        false
                                }
                            );
                        }
                    }
                );
            }

        } catch (e) {

            console.warn(
                'Batch vocab extraction warning',
                e
            );
        }

        await sleep(500);
    }

    window.vocabList =
        Array.from(
            allExtractedVocabMap.values()
        );

    /*
     * シャッフル中なら再構築
     */
    if (window.isShuffled) {

        window.shuffledVocabList =
            [...window.vocabList].sort(
                function() {
                    return Math.random() - 0.5;
                }
            );
    }
}

/* =========================================================
   SPEECH SYNTHESIS
========================================================= */

function speakIndonesian(text) {

    if (
        !('speechSynthesis' in window)
    ) {
        showToast(
            'このブラウザは音声読み上げに対応していません',
            'error'
        );
        return;
    }

    text =
        String(text || '').trim();

    if (!text) {
        return;
    }

    window.speechSynthesis.cancel();

    var utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.lang =
        'id-ID';

    utterance.rate =
        0.85;

    var voices =
        window.speechSynthesis.getVoices();

    var indoVoice =
        voices.find(
            function(v) {

                var lang =
                    String(
                        v.lang || ''
                    ).toLowerCase();

                return (
                    lang.startsWith('id') ||
                    lang.includes('id-id')
                );
            }
        );

    if (indoVoice) {
        utterance.voice =
            indoVoice;
    }

    window.speechSynthesis.speak(
        utterance
    );
}


function stopAllSpeech() {

    if (
        !('speechSynthesis' in window)
    ) {
        return;
    }

    window.speechSynthesis.cancel();

    if (
        window.activeSpeechState.blockId
    ) {

        updateBlockToggleUI(
            window.activeSpeechState.blockId,
            'stopped'
        );
    }

    window.activeSpeechState = {
        blockId: null,
        utterance: null,
        isPlaying: false,
        isPaused: false
    };
}


function speakFromWord(
    blockId,
    wordIndex
) {

    var cleanId =
        String(blockId || '')
            .replace(/^[tg]-/, '');

    var block =
        window.transcriptBlocks.find(
            function(b) {
                return b.id === cleanId;
            }
        );

    if (
        !block ||
        !block.indonesian
    ) {
        return;
    }

    var words =
        block.indonesian.split(
            /\s+/
        );

    startSpeechBlock(
        blockId,
        words
            .slice(wordIndex)
            .join(' ')
    );
}


function toggleSpeechBlock(blockId) {

    if (
        !('speechSynthesis' in window)
    ) {
        return;
    }

    if (
        window.activeSpeechState.blockId ===
        blockId
    ) {

        if (
            window.speechSynthesis.paused ||
            window.activeSpeechState.isPaused
        ) {

            window.speechSynthesis.resume();

            window.activeSpeechState.isPaused =
                false;

            window.activeSpeechState.isPlaying =
                true;

            updateBlockToggleUI(
                blockId,
                'playing'
            );

        } else if (
            window.speechSynthesis.speaking
        ) {

            window.speechSynthesis.pause();

            window.activeSpeechState.isPaused =
                true;

            window.activeSpeechState.isPlaying =
                false;

            updateBlockToggleUI(
                blockId,
                'paused'
            );

        } else {

            startSpeechBlock(
                blockId
            );
        }

    } else {

        startSpeechBlock(
            blockId
        );
    }
}


function startSpeechBlock(
    blockId,
    customText
) {

    if (
        !('speechSynthesis' in window)
    ) {
        return;
    }

    stopAllSpeech();

    var cleanId =
        String(blockId || '')
            .replace(/^[tg]-/, '');

    var block =
        window.transcriptBlocks.find(
            function(b) {
                return b.id === cleanId;
            }
        );

    if (!block) {
        return;
    }

    var textToSpeak =
        customText ||
        block.indonesian;

    if (!textToSpeak) {
        return;
    }

    var utterance =
        new SpeechSynthesisUtterance(
            textToSpeak
        );

    utterance.lang =
        'id-ID';

    utterance.rate =
        0.85;

    var voices =
        window.speechSynthesis.getVoices();

    var indoVoice =
        voices.find(
            function(v) {

                var lang =
                    String(
                        v.lang || ''
                    ).toLowerCase();

                return (
                    lang.startsWith('id') ||
                    lang.includes('id-id')
                );
            }
        );

    if (indoVoice) {
        utterance.voice =
            indoVoice;
    }

    utterance.onstart =
        function() {

            window.activeSpeechState = {
                blockId:
                    blockId,

                utterance:
                    utterance,

                isPlaying:
                    true,

                isPaused:
                    false
            };

            updateBlockToggleUI(
                blockId,
                'playing'
            );
        };

    utterance.onpause =
        function() {

            window.activeSpeechState.isPaused =
                true;

            window.activeSpeechState.isPlaying =
                false;

            updateBlockToggleUI(
                blockId,
                'paused'
            );
        };

    utterance.onend =
        function() {

            updateBlockToggleUI(
                blockId,
                'stopped'
            );

            window.activeSpeechState = {
                blockId: null,
                utterance: null,
                isPlaying: false,
                isPaused: false
            };
        };

    utterance.onerror =
        function() {

            updateBlockToggleUI(
                blockId,
                'stopped'
            );

            window.activeSpeechState = {
                blockId: null,
                utterance: null,
                isPlaying: false,
                isPaused: false
            };
        };

    window.speechSynthesis.speak(
        utterance
    );
}


function updateBlockToggleUI(
    blockId,
    state
) {

    var btn =
        document.getElementById(
            'btn-toggle-' +
            blockId
        );

    if (!btn) {
        return;
    }

    if (state === 'playing') {

        btn.innerHTML =
            '<i class="fa-solid fa-pause text-red-500"></i>' +
            '<span>一時停止</span>';

    } else if (state === 'paused') {

        btn.innerHTML =
            '<i class="fa-solid fa-play text-amber-500"></i>' +
            '<span>再開</span>';

    } else {

        btn.innerHTML =
            '<i class="fa-solid fa-play"></i>' +
            '<span>再生</span>';
    }
}


/* =========================================================
   HTML / JS ESCAPING
========================================================= */

function escapeHtml(str) {

    if (
        str === null ||
        str === undefined
    ) {
        return '';
    }

    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


/*
 * HTML escape と JavaScript string escape は別物。
 *
 * 元コードでは
 *
 * onclick="speakIndonesian(' + escapeHtml(v.indonesian) + ')"
 *
 * となっていたため、don't / user's のような文字列で
 * onclickが壊れる可能性があった。
 */
function escapeJsString(str) {

    return String(str || '')
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\r/g, '\\r')
        .replace(/\n/g, '\\n')
        .replace(/<\/script/gi, '<\\/script');
}

/* =========================================================
   VOCAB SEARCH
========================================================= */

function highlightMatch(
    str,
    query
) {

    var safeStr =
        escapeHtml(str || '');

    var q =
        String(query || '')
            .trim();

    if (!q) {
        return safeStr;
    }

    try {

        var escQuery =
            q.replace(
                /[.*+?^${}()|[\]\\]/g,
                '\\$&'
            );

        var regex =
            new RegExp(
                '(' +
                escQuery +
                ')',
                'gi'
            );

        return safeStr.replace(
            regex,
            '<mark class="search-highlight">$1</mark>'
        );

    } catch (e) {

        return safeStr;
    }
}


function getFilteredVocabList() {

    var filtered =
        window.isShuffled
            ? [...window.shuffledVocabList]
            : (window.vocabList || []);

    if (
        window.activeVocabPosFilter !==
        'all'
    ) {

        filtered =
            filtered.filter(
                function(v) {

                    return (
                        v.pos ===
                        window.activeVocabPosFilter
                    );
                }
            );
    }

    var query =
        String(
            window.activeVocabSearchQuery ||
            ''
        )
        .trim()
        .toLowerCase();

    if (query !== '') {

        filtered =
            filtered.filter(
                function(v) {

                    return (
                        String(
                            v.indonesian || ''
                        )
                        .toLowerCase()
                        .includes(query) ||

                        String(
                            v.japanese || ''
                        )
                        .toLowerCase()
                        .includes(query) ||

                        String(
                            v.baseForm || ''
                        )
                        .toLowerCase()
                        .includes(query)
                    );
                }
            );
    }

    return filtered;
}

) {

/* =========================================================
   SAVE HISTORY
========================================================= */

function saveCurrentToHistory(
    fileName,
    showToastNotification
) {

    if (
        showToastNotification ===
        undefined
    ) {
        showToastNotification =
            true;
    }

    if (
        !window.transcriptBlocks ||
        window.transcriptBlocks.length === 0
    ) {
        return;
    }

    try {

        var history =
            JSON.parse(
                localStorage.getItem(
                    'suarateks_history'
                ) ||
                '[]'
            );

        var targetName =
            fileName ||
            (
                window.currentLoadedFile
                    ? window.currentLoadedFile.name
                    : '音源解析データ'
            );

        history =
            history.filter(
                function(h) {
                    return (
                        h.fileName !==
                        targetName
                    );
                }
            );

        var item = {

            id:
                'hist-' +
                Date.now(),

            fileName:
                targetName,

            date:
                new Date().toLocaleDateString(
                    'ja-JP',
                    {
                        month: 'numeric',
                        day: 'numeric',
                        hour: '2-digit',
                        minute: '2-digit'
                    }
                ),

            blocks:
                window.transcriptBlocks,

            vocab:
                window.vocabList
        };

        history.unshift(
            item
        );

        /*
         * 最大6件。
         *
         * 6件目を自動バックアップして
         * リセットする元仕様を維持。
         */
        if (history.length >= 6) {

            exportDataToFile(
                item,
                targetName +
                '_6th_auto_backup.json'
            );

            history = [];

            localStorage.removeItem(
                'suarateks_history'
            );

            renderHistoryList([]);

            if (showToastNotification) {

                showToast(
                    '履歴が6件に達したため6件目を自動JSON保存しリセットしました',
                    'info'
                );
            }

        } else {

            localStorage.setItem(
                'suarateks_history',
                JSON.stringify(history)
            );

            renderHistoryList(
                history
            );

            if (showToastNotification) {

                showToast(
                    '履歴に保存しました (' +
                    history.length +
                    '/6件)',
                    'info'
                );
            }
        }

    } catch (e) {

        console.warn(
            'LocalStorage Save Error:',
            e
        );

        showToast(
            '履歴保存に失敗しました: ' +
            e.message,
            'error'
        );
    }
}


/* =========================================================
   MERGE HISTORY
========================================================= */

function mergeSelectedHistories() {

    if (
        window.selectedHistoryIds.length <
        2
    ) {
        return;
    }

    var history;

    try {

        history =
            JSON.parse(
                localStorage.getItem(
                    'suarateks_history'
                ) ||
                '[]'
            );

    } catch (e) {

        showToast(
            '履歴データの読み込みに失敗しました',
            'error'
        );

        return;
    }

    var selectedItems =
        window.selectedHistoryIds
            .map(
                function(id) {

                    return history.find(
                        function(h) {
                            return h.id === id;
                        }
                    );
                }
            )
            .filter(Boolean);

    if (
        selectedItems.length < 2
    ) {
        return;
    }

    var mergedBlocks = [];
    var mergedVocabMap = new Map();
    var titleParts = [];

    var globalBlockIdx = 0;

    selectedItems.forEach(
        function(item) {

            titleParts.push(
                String(
                    item.fileName || ''
                )
                .replace(
                    /\.[^/.]+$/,
                    ''
                )
            );

            if (
                Array.isArray(
                    item.blocks
                )
            ) {

                item.blocks.forEach(
                    function(b) {

                        mergedBlocks.push({

                            id:
                                'block-merged-' +
                                Date.now() +
                                '-' +
                                globalBlockIdx,

                            blockIndex:
                                globalBlockIdx,

                            speaker:
                                b.speaker ||
                                'Pembicara',

                            indonesian:
                                b.indonesian ||
                                '',

                            japanese:
                                b.japanese ||
                                '',

                            grammarExplanation:
                                b.grammarExplanation ||
                                ''
                        });

                        globalBlockIdx++;
                    }
                );
            }

            if (
                Array.isArray(
                    item.vocab
                )
            ) {

                item.vocab.forEach(
                    function(v) {

                        var key =
                            String(
                                v.indonesian ||
                                ''
                            )
                            .trim()
                            .toLowerCase();

                        if (
                            key &&
                            !mergedVocabMap.has(key)
                        ) {

                            mergedVocabMap.set(
                                key,
                                {
                                    ...v,

                                    id:
                                        'vocab-merged-' +
                                        Date.now() +
                                        '-' +
                                        mergedVocabMap.size
                                }
                            );
                        }
                    }
                );
            }
        }
    );

    var mergedTitle =
        '結合_' +
        titleParts
            .join('_')
            .substring(0, 20);

    window.transcriptBlocks =
        mergedBlocks;

    window.vocabList =
        Array.from(
            mergedVocabMap.values()
        );

    renderTranscriptContainer();
    renderGrammarContainer();
    renderVocabContainer();

    var mergedDataObj = {

        id:
            'hist-merged-' +
            Date.now(),

        fileName:
            mergedTitle,

        date:
            new Date().toLocaleDateString(
                'ja-JP',
                {
                    month: 'numeric',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                }
            ),

        blocks:
            window.transcriptBlocks,

        vocab:
            window.vocabList
    };

    exportDataToFile(
        mergedDataObj,
        mergedTitle +
        '_merged.json'
    );

    saveCurrentToHistory(
        mergedTitle,
        false
    );

    window.selectedHistoryIds =
        [];

    showToast(
        '選択した ' +
        selectedItems.length +
        ' 件を1つの統合ファイルに結合・保存しました！',
        'info'
    );

    if (
        window.innerWidth < 768
    ) {
        switchMobileTab(
            'transcript'
        );
    }
}

/* =========================================================
   JSON EXPORT
========================================================= */

function exportDataToFile(
    dataObj,
    customFilename
) {

    try {

        var dataStr =
            JSON.stringify(
                dataObj,
                null,
                2
            );

        var blob =
            new Blob(
                [dataStr],
                {
                    type:
                        'application/json'
                }
            );

        var url =
            URL.createObjectURL(
                blob
            );

        var a =
            document.createElement(
                'a'
            );

        a.href =
            url;

        a.download =
            customFilename ||
            (
                'suarateks_backup_' +
                new Date()
                    .toISOString()
                    .slice(0, 10)
                    .replace(
                        /-/g,
                        ''
                    ) +
                '.json'
            );

        document.body.appendChild(a);

        a.click();

        a.remove();

        setTimeout(
            function() {
                URL.revokeObjectURL(
                    url
                );
            },
            1000
        );

    } catch (e) {

        console.error(
            'JSON Export Error:',
            e
        );

        showToast(
            'JSON保存に失敗しました: ' +
            e.message,
            'error'
        );
    }
}


/* =========================================================
   JSON IMPORT
========================================================= */

function importHistoryBackup(
    event
) {

    var file =
        event &&
        event.target &&
        event.target.files
            ? event.target.files[0]
            : null;

    if (!file) {
        return;
    }

    var reader =
        new FileReader();

    reader.onload =
        function(e) {

            try {

                var importedData =
                    JSON.parse(
                        e.target.result
                    );

                var singleObj =
                    Array.isArray(
                        importedData
                    )
                        ? importedData[0]
                        : importedData;

                if (
                    !singleObj ||
                    !Array.isArray(
                        singleObj.blocks
                    )
                ) {

                    throw new Error(
                        '正しい解析JSONファイルではありません'
                    );
                }

                window.transcriptBlocks =
                    singleObj.blocks || [];

                window.vocabList =
                    Array.isArray(
                        singleObj.vocab
                    )
                        ? singleObj.vocab
                        : [];

                renderTranscriptContainer();
                renderGrammarContainer();
                renderVocabContainer();

                saveCurrentToHistory(
                    singleObj.fileName ||
                    file.name,
                    false
                );

                showToast(
                    '「' +
                    (
                        singleObj.fileName ||
                        file.name
                    ) +
                    '」を復元読み込みしました！',
                    'info'
                );

                if (
                    window.innerWidth < 768
                ) {

                    switchMobileTab(
                        'transcript'
                    );
                }

            } catch (err) {

                showToast(
                    '復元失敗: ' +
                    err.message,
                    'error'
                );

            } finally {

                if (
                    event &&
                    event.target
                ) {
                    event.target.value =
                        '';
                }
            }
        };

    reader.onerror =
        function() {

            showToast(
                'JSONファイルの読み込みに失敗しました',
                'error'
            );

            if (
                event &&
                event.target
            ) {
                event.target.value =
                    '';
            }
        };

    reader.readAsText(
        file
    );
}

        );

    if (
        window.innerWidth >= 768
    ) {

        if (panelSetup) {
            panelSetup.style.display =
                'flex';
        }

        if (panelTranscript) {
            panelTranscript.style.display =
                'flex';
        }

        return;
    }

    if (tab === 'setup') {

        if (panelSetup) {
            panelSetup.style.display =
                'flex';
        }

        if (panelTranscript) {
            panelTranscript.style.display =
                'none';
        }

    } else {

        if (panelSetup) {
            panelSetup.style.display =
                'none';
        }

        if (panelTranscript) {
            panelTranscript.style.display =
                'flex';
        }

        setStudioSubView(
            tab
        );
    }
}


/* =========================================================
   STUDIO SUBVIEW
========================================================= */

function setStudioSubView(
    subView
) {

    window.activeStudioSubView =
        subView;

    var viewTranscript =
        document.getElementById(
            'transcriptView'
        );

    var viewGrammar =
        document.getElementById(
            'grammarView'
        );

    var viewVocab =
        document.getElementById(
            'vocabView'
        );

    var btnTranscript =
        document.getElementById(
            'navTabTranscript'
        );

    var btnGrammar =
        document.getElementById(
            'navTabGrammar'
        );

    var btnVocab =
        document.getElementById(
            'navTabVocab'
        );

    if (viewTranscript) {
        viewTranscript.classList.add(
            'hidden'
        );
    }

    if (viewGrammar) {
        viewGrammar.classList.add(
            'hidden'
        );
    }

    if (viewVocab) {

        viewVocab.classList.add(
            'hidden'
        );

        viewVocab.classList.remove(
            'flex'
        );
    }

    [
        btnTranscript,
        btnGrammar,
        btnVocab
    ].forEach(
        function(btn) {

            if (btn) {

                btn.className =
                    'no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition flex items-center gap-1 shrink-0';
            }
        }
    );

    if (
        subView ===
        'transcript'
    ) {

        if (viewTranscript) {
            viewTranscript.classList.remove(
                'hidden'
            );
        }

        if (btnTranscript) {

            btnTranscript.className =
                'no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-extrabold bg-red-600 text-white shadow-md transition flex items-center gap-1 shrink-0';
        }

    } else if (
        subView ===
        'grammar'
    ) {

        if (viewGrammar) {
            viewGrammar.classList.remove(
                'hidden'
            );
        }

        if (btnGrammar) {

            btnGrammar.className =
                'no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-extrabold bg-red-600 text-white shadow-md transition flex items-center gap-1 shrink-0';
        }

        renderGrammarContainer();

    } else if (
        subView ===
        'vocab'
    ) {

        if (viewVocab) {

            viewVocab.classList.remove(
                'hidden'
            );

            viewVocab.classList.add(
                'flex'
            );
        }

        if (btnVocab) {

            btnVocab.className =
                'no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-extrabold bg-red-600 text-white shadow-md transition flex items-center gap-1 shrink-0';
        }

        renderVocabContainer();
    }
}


/* =========================================================
   API KEY
========================================================= */

function openModal(id) {

    var input =
        document.getElementById(
            'apiKeyInput'
        );

    if (input) {
        input.value =
            getApiKey();
    }

    var modal =
        document.getElementById(id);

    if (modal) {
        modal.classList.remove(
            'hidden'
        );
    }
}


function closeModal(id) {

    var modal =
        document.getElementById(id);

    if (modal) {
        modal.classList.add(
            'hidden'
        );
    }
}


function getApiKey() {

    var key =
        localStorage.getItem(
            'suarateks_gemini_key'
        ) ||
        '';

    return String(
        key
    ).trim();
}


function saveApiKeyFromModal() {

    var input =
        document.getElementById(
            'apiKeyInput'
        );

    var val =
        input
            ? input.value
            : '';

    var clean =
        String(
            val
        ).trim();

    if (
        clean &&
        clean.length > 10
    ) {

        localStorage.setItem(
            'suarateks_gemini_key',
            clean
        );

        showToast(
            'API Keyを保存しました！',
            'info'
        );

        closeModal(
            'apiKeyModal'
        );

    } else {

        showToast(
            '有効なAPI Keyを入力してください',
            'error'
        );
    }
}


/* =========================================================
   TOAST
========================================================= */

function showToast(
    message,
    type
) {

    if (type === undefined) {
        type = 'info';
    }

    var container =
        document.getElementById(
            'toastContainer'
        );

    if (!container) {
        return;
    }

    var toast =
        document.createElement(
            'div'
        );

    var bgColor =
        type === 'error'
            ? 'bg-rose-600'
            : 'bg-slate-800';

    var icon =
        type === 'error'
            ? 'fa-circle-exclamation'
            : 'fa-circle-check';

    toast.className =
        bgColor +
        ' text-white px-3 py-2 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto border border-white/10';

    toast.innerHTML =
        '<i class="fa-solid ' +
        icon +
        ' text-amber-400 text-sm"></i>' +
        '<span>' +
        escapeHtml(
            message
        ) +
        '</span>';

    container.appendChild(
        toast
    );

    setTimeout(
        function() {

            toast.classList.remove(
                'translate-y-2',
                'opacity-0'
            );

        },
        10
    );

    setTimeout(
        function() {

            toast.classList.add(
                'opacity-0',
                'translate-y-[-8px]'
            );

            setTimeout(
                function() {

                    toast.remove();

                },
                300
            );

        },
        5000
    );
}


/* =========================================================
   RESPONSIVE
========================================================= */

window.addEventListener(
    'resize',
    function() {

        if (

        ) {

            var panelSetup =
