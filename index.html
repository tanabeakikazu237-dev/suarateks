    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { indoRed: { 500: '#E70011', 600: '#C8000F', 700: '#A0000C' } }
                }
            }
        };
    </script>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --transcript-font-size: 20px; }
        .dynamic-text-indo { font-size: var(--transcript-font-size, 20px); line-height: 1.4; }
        .dynamic-text-ja { font-size: calc(var(--transcript-font-size, 20px) * 0.75); line-height: 1.4; }
        
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }

        .word-clickable { cursor: pointer; border-bottom: 1.5px dotted #94a3b8; transition: all 0.15s; display: inline-block; }
        .word-clickable:hover { color: #e70011; border-bottom-color: #e70011; background-color: rgba(231, 0, 17, 0.08); border-radius: 2px; }
        .search-highlight { background-color: #fef08a; color: #854d0e; font-weight: bold; padding: 0 2px; border-radius: 2px; }

        .dropzone-active { border-color: #e70011 !important; background-color: rgba(231, 0, 17, 0.05) !important; }
        .no-wrap-tab { whitespace: nowrap !important; word-break: keep-all !important; flex-shrink: 0 !important; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-[100dvh] flex flex-col font-sans overflow-hidden">

    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none max-w-sm"></div>

    <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-4 py-2 flex items-center justify-between shrink-0">
        <h1 class="font-extrabold text-sm flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-red-600 inline-block"></span>
            SuaraTeks<span class="text-red-600">ID</span> Pro
        </h1>
        <button onclick="openModal('apiKeyModal')" class="px-3 py-1 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-lg text-xs font-bold transition flex items-center gap-1">
            <i class="fa-solid fa-key text-[10px]"></i> API Key
        </button>
    </header>

    <div class="md:hidden bg-slate-200 dark:bg-slate-800 p-1 flex items-center gap-1 shrink-0 border-b border-slate-300 dark:border-slate-700 text-xs font-bold">
        <button id="btnMobSetup" onclick="switchMobileTab('setup')" class="flex-1 py-1.5 text-center bg-white dark:bg-slate-700 rounded shadow-sm text-slate-800 dark:text-slate-100">設定・音源</button>
        <button id="btnMobTranscript" onclick="switchMobileTab('transcript')" class="flex-1 py-1.5 text-center text-slate-600 dark:text-slate-400">本文</button>
        <button id="btnMobVocab" onclick="switchMobileTab('vocab')" class="flex-1 py-1.5 text-center text-slate-600 dark:text-slate-400">単語帳</button>
    </div>

    <div class="flex-1 flex overflow-hidden p-2 sm:p-3 gap-3 max-w-7xl mx-auto w-full">

        <div id="panelSetup" class="w-full md:w-72 flex flex-col gap-3 shrink-0 overflow-y-auto">
            <div id="playerCard" class="bg-white dark:bg-slate-800 p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-3">
                <h3 class="font-extrabold text-xs text-slate-700 dark:text-slate-200 flex items-center justify-between">

                        <div id="dropzoneDefault" class="space-y-1">
                            <div class="w-8 h-8 mx-auto rounded-full bg-red-100 dark:bg-red-950/60 flex items-center justify-center text-red-600 group-hover:scale-110 transition-transform">
                                <i class="fa-solid fa-cloud-arrow-up text-sm"></i>
                            </div>
                            <p class="text-xs font-extrabold text-slate-700 dark:text-slate-200">複数音源を選択（最大10件）</p>
                            <p class="text-[9px] text-slate-400">ドラッグ＆ドロップ対応</p>

                        <div id="dropzoneSelected" class="hidden space-y-1 text-left">

                                <span class="text-[9px] text-slate-400">タップで再選択</span>

                        </div>

            <h3 class="font-bold text-sm text-slate-800 dark:text-slate-100 flex items-center gap-1.5">
                <i class="fa-solid fa-key text-amber-500"></i> Gemini API Key 設定
            </h3>
            <div id="apiKeyNotice" class="hidden p-2 bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800 rounded text-[11px] text-amber-800 dark:text-amber-200 font-medium leading-snug">
                <i class="fa-solid fa-triangle-exclamation mr-1 text-amber-600"></i> API利用上限（Spend Cap / Quota）に達しました。新しいAPI Keyを入力して保存すると、解析を再開できます。
            </div>
            <p class="text-[10px] text-slate-400">Google AI Studio で取得した API Key を入力してください</p>
            <input type="password" id="apiKeyInput" placeholder="API Key を貼り付け" class="w-full px-3 py-2 rounded border border-slate-300 dark:border-slate-600 text-xs dark:bg-slate-900 font-mono text-slate-800 dark:text-slate-100 focus:outline-none focus:border-red-500">
            <div class="flex justify-end gap-2">
                <button onclick="closeModal('apiKeyModal')" class="px-3 py-1 text-xs text-slate-500 hover:text-slate-700">キャンセル</button>
                <button onclick="saveApiKeyFromModal()" class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded text-xs font-bold">保存して再開</button>
            </div>
        </div>
    </div>

    <script>
        window.fileQueue = [];
        window.isQueueProcessing = false;
        window.currentLoadedFile = null;
        window.currentAudioBase64 = null;
        window.transcriptBlocks = [];
        window.vocabList = [];
        window.activeMobileTab = 'setup';
        window.activeStudioSubView = 'transcript';
        window.activeVocabMode = 'card';
        window.activeVocabPosFilter = 'all';
        window.activeVocabSearchQuery = '';
        window.currentCardIndex = 0;
        window.isCardFlipped = false;
        window.isShuffled = false;
        window.shuffledVocabList = [];
        window.selectedHistoryIds = [];

        window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };

        var sleep = function(ms) { return new Promise(function(resolve) { setTimeout(resolve, ms); }); };

        function getApiKey() { 
            var key = localStorage.getItem('suarateks_gemini_key') || '';
            return String(key).trim();
        }

        function stripJsonCodeFence(text) {
            return String(text || '')
                .trim()
                .replace(/^```json\s*/i, '')
                .replace(/^```\s*/i, '')
                .replace(/\s*```$/i, '')
                .trim();
        }

        function safeParseTruncatedJson(jsonString) {
            var raw = stripJsonCodeFence(jsonString);
            if (!raw) throw new Error('Geminiから応答が返されませんでした');

            try {
                return JSON.parse(raw);
            } catch (e) {
                console.warn('[Gemini JSON] 直接パース失敗。候補スコープ抽出を試みます...', e);
            }

            var firstBracket = raw.indexOf('[');
            var lastBracket = raw.lastIndexOf(']');
            if (firstBracket !== -1 && lastBracket > firstBracket) {
                var arrayCandidate = raw.substring(firstBracket, lastBracket + 1);
                try {
                    return JSON.parse(arrayCandidate);
                } catch (err) {
                    var lastObjEnd = arrayCandidate.lastIndexOf('}');
                    if (lastObjEnd !== -1) {
                        var repairedArray = arrayCandidate.substring(0, lastObjEnd + 1) + ']';
                        try { return JSON.parse(repairedArray); } catch (e2) {}
                    }
                }
            }

            var firstBrace = raw.indexOf('{');
            var lastBrace = raw.lastIndexOf('}');
            if (firstBrace !== -1 && lastBrace > firstBrace) {
                var objectCandidate = raw.substring(firstBrace, lastBrace + 1);
                try {

        async function fetchGeminiApi(apiKey, payload) {
            var cleanKey = String(apiKey || getApiKey() || '').trim();
            if (!cleanKey || cleanKey.length < 10) {
                throw new Error('API Keyが正しく設定されていません。「API Key」ボタンから設定してください。');
            }

            if (!payload.generationConfig) payload.generationConfig = {};
            payload.generationConfig.temperature = 0.1;

            var targetUrl = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=' + cleanKey;

            var response;
            for (var attempt = 1; attempt <= 4; attempt++) {
                try {
                    response = await fetch(targetUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.status === 429 || response.status === 503) {
                        await sleep(attempt * 2000);
                        continue;
                    }
                    break;
                } catch (netErr) {
                    if (attempt === 4) throw new Error('ネットワーク通信エラーが発生しました: ' + netErr.message);
                    await sleep(1500);
                }
            }

            if (!response) throw new Error('Gemini APIへの通信に失敗しました');

            var responseText = await response.text();
            var data;

            try {
                data = JSON.parse(responseText);
            } catch (err) {
                throw new Error('Gemini APIから無効な応答形式を受信しました (HTTP ' + response.status + ')');
            }

            if (!response.ok || data.error) {
                var errDetail = (data.error && data.error.message) ? data.error.message : ('HTTP Error ' + response.status);
                var isSpendCap = errDetail.toLowerCase().includes('spend cap breached') || response.status === 403;
                if (isSpendCap) {
                    throw new Error('API利用予算制限（Spend Cap / Billing Limit）に達しました。Google AI Studioで予算設定を確認するか、新しいAPI Keyをご利用ください。');
                }
                throw new Error(errDetail);
            }

            return data;
        }

        function extractGeminiText(data) {
            var parts = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) ? data.candidates[0].content.parts : null;
            if (!Array.isArray(parts)) throw new Error('応答にテキストデータが含まれていません');
            return parts.map(function(p) { return p.text || ''; }).join('').trim();
        }

        function saveApiKeyFromModal() {
            var input = document.getElementById('apiKeyInput');
            var val = input ? input.value : '';
            var clean = String(val).trim();
            if (clean && clean.length > 5) {
                localStorage.setItem('suarateks_gemini_key', clean);
                showToast('API Keyを保存しました！解析を再開できます。', 'info');
                closeModal('apiKeyModal');
                
                var hasWaitingOrError = window.fileQueue.some(function(q) { return q.status === 'waiting' || q.status === 'error'; });
                if (hasWaitingOrError && !window.isQueueProcessing) {
                    window.fileQueue.forEach(function(q) { if (q.status === 'error') q.status = 'waiting'; });
                    renderQueueUI();
                    window.processAudioWithGemini();

            if (ptDisplay) ptDisplay.textContent = val + ' pt';

        function adjustFontSize(delta) {
            var slider = document.getElementById('fontSizeSlider');
            if (slider) {
                var val = parseInt(slider.value) + delta;
                val = Math.max(16, Math.min(32, val));
                slider.value = val;
                setFontSize(val);

        function speakIndonesian(text) {
            if (!('speechSynthesis' in window) || !text) return;
            window.speechSynthesis.cancel();
            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 0.85;
            var voices = window.speechSynthesis.getVoices();
            var indoVoice = voices.find(function(v) { return v.lang.startsWith('id') || v.lang.includes('ID'); });
            if (indoVoice) utterance.voice = indoVoice;
            window.speechSynthesis.speak(utterance);
        }

        function stopAllSpeech() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            if (window.activeSpeechState.blockId) updateBlockToggleUI(window.activeSpeechState.blockId, 'stopped');
            window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };
        }

        function speakFromWord(blockId, wordIndex) {
            var cleanId = blockId.replace(/^[tg]-/, '');
            var block = window.transcriptBlocks.find(function(b) { return b.id === cleanId; });
            if (!block || !block.indonesian) return;
            var words = block.indonesian.split(/\s+/);
            startSpeechBlock(blockId, words.slice(wordIndex).join(' '));
        }

        function toggleSpeechBlock(blockId) {
            if (!('speechSynthesis' in window)) return;
            if (window.activeSpeechState.blockId === blockId) {
                if (window.speechSynthesis.paused || window.activeSpeechState.isPaused) {
                    window.speechSynthesis.resume();
                    window.activeSpeechState.isPaused = false;
                    window.activeSpeechState.isPlaying = true;
                    updateBlockToggleUI(blockId, 'playing');
                } else if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.pause();
                    window.activeSpeechState.isPaused = true;
                    window.activeSpeechState.isPlaying = false;
                    updateBlockToggleUI(blockId, 'paused');
                } else {
                    startSpeechBlock(blockId);
                }
            } else {
                startSpeechBlock(blockId);
            }
        }

        function startSpeechBlock(blockId, customText) {
            if (!('speechSynthesis' in window)) return;
            stopAllSpeech();
            var cleanId = blockId.replace(/^[tg]-/, '');
            var block = window.transcriptBlocks.find(function(b) { return b.id === cleanId; });
            if (!block) return;

            var textToSpeak = customText || block.indonesian;
            var utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'id-ID';
            utterance.rate = 0.85;

            var voices = window.speechSynthesis.getVoices();
            var indoVoice = voices.find(function(v) { return v.lang.startsWith('id') || v.lang.includes('ID'); });
            if (indoVoice) utterance.voice = indoVoice;

            utterance.onstart = function() {
                window.activeSpeechState = { blockId: blockId, utterance: utterance, isPlaying: true, isPaused: false };
                updateBlockToggleUI(blockId, 'playing');
            };
            utterance.onpause = function() {
                window.activeSpeechState.isPaused = true;
                window.activeSpeechState.isPlaying = false;
                updateBlockToggleUI(blockId, 'paused');
            };
            utterance.onend = function() {
                updateBlockToggleUI(blockId, 'stopped');
                window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };
            };
            utterance.onerror = function() {
                updateBlockToggleUI(blockId, 'stopped');
                window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };
            };

            window.speechSynthesis.speak(utterance);
        }

        function updateBlockToggleUI(blockId, state) {
            var btn = document.getElementById('btn-toggle-' + blockId);
            if (!btn) return;
            if (state === 'playing') btn.innerHTML = '<i class="fa-solid fa-pause text-red-500"></i><span>一時停止</span>';
            else if (state === 'paused') btn.innerHTML = '<i class="fa-solid fa-play text-amber-500"></i><span>再開</span>';
            else btn.innerHTML = '<i class="fa-solid fa-play"></i><span>再生</span>';
        }

        function highlightMatch(str, query) {
            var safeStr = escapeHtml(str || '');
            var q = (query || '').trim();
            if (!q) return safeStr;
            try {
                var escQuery = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                var regex = new RegExp('(' + escQuery + ')', 'gi');
                return safeStr.replace(regex, '<mark class="search-highlight">$1</mark>');
            } catch (e) { return safeStr; }
        }

        function getFilteredVocabList() {
            var filtered = window.isShuffled ? Array.from(window.shuffledVocabList) : (window.vocabList || []);
            if (window.activeVocabPosFilter !== 'all') {
                filtered = filtered.filter(function(v) { return v.pos === window.activeVocabPosFilter; });
            }
            var query = (window.activeVocabSearchQuery || '').trim().toLowerCase();
            if (query !== '') {
                filtered = filtered.filter(function(v) {
                    return (v.indonesian || '').toLowerCase().includes(query) || (v.japanese || '').toLowerCase().includes(query) || (v.baseForm || '').toLowerCase().includes(query);
                });
            }
            return filtered;
        }

        function manualSaveHistory() {

                return;
            }
            var name = window.currentLoadedFile ? window.currentLoadedFile.name.replace(/\.[^/.]+$/, "") : '解析データ';
            var singleDataObj = {
                id: 'hist-' + Date.now(),
                fileName: name,
                date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                blocks: window.transcriptBlocks,
                vocab: window.vocabList
            };
            exportDataToFile(singleDataObj, name + '_suarateks_analysis.json');
            saveCurrentToHistory(name, false);
            showToast('個別のJSONファイルとして保存しました！', 'info');
        }

        function saveCurrentToHistory(fileName, showToastNotification) {
            if (showToastNotification === undefined) showToastNotification = true;
            if (!window.transcriptBlocks || window.transcriptBlocks.length === 0) return;

            try {
                var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
                var targetName = fileName || (window.currentLoadedFile ? window.currentLoadedFile.name : '音源解析データ');

                history = history.filter(function(h) { return h.fileName !== targetName; });

                var item = {
                    id: 'hist-' + Date.now(),
                    fileName: targetName,
                    date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    blocks: window.transcriptBlocks,
                    vocab: window.vocabList
                };

                history.unshift(item);

                if (history.length >= 15) {
                    history = [];
                    localStorage.removeItem('suarateks_history');
                    renderHistoryList([]);
                    if (showToastNotification) showToast('履歴が15件に達したため履歴を自動リセットしました', 'info');
                } else {
                    localStorage.setItem('suarateks_history', JSON.stringify(history));
                    renderHistoryList(history);
                    if (showToastNotification) showToast('履歴に保存しました (' + history.length + '/15件)', 'info');
                }
            } catch (e) { console.warn('LocalStorage Save Error:', e); }
        }

        window.addEventListener('beforeunload', function() {
            if (window.transcriptBlocks && window.transcriptBlocks.length > 0) {
                try {
                    var targetName = window.currentLoadedFile ? window.currentLoadedFile.name.replace(/\.[^/.]+$/, "") : '自動一時保存';
                    var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
                    history = history.filter(function(h) { return h.fileName !== targetName; });
                    history.unshift({
                        id: 'hist-' + Date.now(),
                        fileName: targetName,
                        date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                        blocks: window.transcriptBlocks,
                        vocab: window.vocabList
                    });
                    if (history.length > 15) history = history.slice(0, 15);
                    localStorage.setItem('suarateks_history', JSON.stringify(history));
                } catch(e) {}
            }
        });

        function mergeSelectedHistories() {
            if (window.selectedHistoryIds.length < 2) return;
            var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
            
            var selectedItems = window.selectedHistoryIds.map(function(id) {
                return history.find(function(h) { return h.id === id; });
            }).filter(Boolean);

            if (selectedItems.length < 2) return;

            var mergedBlocks = [];
            var mergedVocabMap = new Map();
            var titleParts = [];

            var globalBlockIdx = 0;
            selectedItems.forEach(function(item) {
                titleParts.push(item.fileName.replace(/\.[^/.]+$/, ""));
                
                if (Array.isArray(item.blocks)) {
                    item.blocks.forEach(function(b) {
                        mergedBlocks.push({
                            id: 'block-merged-' + Date.now() + '-' + globalBlockIdx,
                            blockIndex: globalBlockIdx,
                            speaker: b.speaker || 'Pembicara',
                            indonesian: b.indonesian || '',
                            japanese: b.japanese || '',
                            grammarExplanation: b.grammarExplanation || ''
                        });
                        globalBlockIdx++;
                    });
                }

                if (Array.isArray(item.vocab)) {
                    item.vocab.forEach(function(v) {
                        var key = (v.indonesian || '').trim().toLowerCase();
                        if (key && !mergedVocabMap.has(key)) {
                            var itemCopy = Object.assign({}, v, { id: 'vocab-merged-' + Date.now() + '-' + mergedVocabMap.size });
                            mergedVocabMap.set(key, itemCopy);
                        }
                    });
                }
            });

            var mergedTitle = '結合_' + titleParts.join('_').substring(0, 20);
            window.transcriptBlocks = mergedBlocks;
            window.vocabList = Array.from(mergedVocabMap.values());

            renderTranscriptContainer();
            renderGrammarContainer();
            renderVocabContainer();

            var mergedDataObj = {
                id: 'hist-merged-' + Date.now(),
                fileName: mergedTitle,
                date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                blocks: window.transcriptBlocks,
                vocab: window.vocabList
            };

            exportDataToFile(mergedDataObj, mergedTitle + '_merged.json');
            saveCurrentToHistory(mergedTitle, false);
            window.selectedHistoryIds = [];
            showToast('選択した ' + selectedItems.length + ' 件を1つの統合ファイルに結合・保存しました！', 'info');
            if (window.innerWidth < 768) switchMobileTab('transcript');
        }

        function clearHistory() {
            localStorage.removeItem('suarateks_history');
            window.selectedHistoryIds = [];
            renderHistoryList([]);
            showToast('すべての解析履歴を消去しました', 'info');
        }

        function loadHistoryItem(id) {
            var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
            var found = history.find(function(h) { return h.id === id; });
            if (found) {
                window.transcriptBlocks = found.blocks || [];
                window.vocabList = found.vocab || [];
                renderTranscriptContainer();
                renderGrammarContainer();
                renderVocabContainer();
                
                showToast('「' + found.fileName + '」を復元読み込みしました', 'info');
                if (window.innerWidth < 768) switchMobileTab('transcript');
            }
        }

        function deleteHistoryItem(id, event) {
            if (event) event.stopPropagation();
            var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
            history = history.filter(function(h) { return h.id !== id; });
            window.selectedHistoryIds = window.selectedHistoryIds.filter(function(sid) { return sid !== id; });
            localStorage.setItem('suarateks_history', JSON.stringify(history));
            renderHistoryList(history);
            showToast('削除しました', 'info');
        }

        function exportDataToFile(dataObj, customFilename) {
            var dataStr = JSON.stringify(dataObj, null, 2);
            var blob = new Blob([dataStr], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = customFilename || ('suarateks_backup_' + new Date().toISOString().slice(0,10).replace(/-/g, '') + '.json');
            a.click();
            URL.revokeObjectURL(url);
        }

        async function importHistoryBackup(event) {
            var files = event.target.files ? Array.from(event.target.files) : [];
            if (files.length === 0) return;

            var targetFiles = files.slice(0, 15);
            var successCount = 0;
            var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
            var lastLoadedData = null;

            for (var i = 0; i < targetFiles.length; i++) {
                var file = targetFiles[i];
                try {
                    var content = await new Promise(function(resolve, reject) {
                        var reader = new FileReader();
                        reader.onload = function(e) { resolve(e.target.result); };
                        reader.onerror = function(err) { reject(err); };
                        reader.readAsText(file);
                    });

                    var importedData = JSON.parse(content);
                    var singleObj = Array.isArray(importedData) ? importedData[0] : importedData;

                    if (!singleObj || !singleObj.blocks) continue;

                    var targetName = singleObj.fileName || file.name.replace(/\.[^/.]+$/, "");
                    
                    history = history.filter(function(h) { return h.fileName !== targetName; });

                    var item = {
                        id: 'hist-' + Date.now() + '-' + i,
                        fileName: targetName,
                        date: singleObj.date || new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                        blocks: singleObj.blocks || [],
                        vocab: singleObj.vocab || []
                    };

                    history.unshift(item);
                    lastLoadedData = item;
                    successCount++;
                } catch (err) {
                    console.warn('Import error for file:', file.name, err);
                }
            }

            if (history.length > 15) {
                history = history.slice(0, 15);
            }

            localStorage.setItem('suarateks_history', JSON.stringify(history));
            renderHistoryList(history);

            if (lastLoadedData) {
                window.transcriptBlocks = lastLoadedData.blocks;
                window.vocabList = lastLoadedData.vocab;
                renderTranscriptContainer();
                renderGrammarContainer();
                renderVocabContainer();
            }

            if (successCount > 0) {
                showToast(successCount + ' 件のJSONバックアップを復元・保存しました！', 'info');
                if (window.innerWidth < 768) switchMobileTab('transcript');
            } else {
                showToast('有効なJSONファイルを読み込めませんでした', 'error');
            }

            event.target.value = '';
        }

        function showToast(message, type) {
            if (type === undefined) type = 'info';
            var container = document.getElementById('toastContainer');
            if (!container) return;
            var toast = document.createElement('div');
            var bgColor = type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            var icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';

            toast.className = bgColor + ' text-white px-3 py-2 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto border border-white/10';
            toast.innerHTML = '<i class="fa-solid ' + icon + ' text-amber-400 text-sm shrink-0"></i> <span>' + escapeHtml(message) + '</span>';

            container.appendChild(toast);
            setTimeout(function() { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(function() {
                toast.classList.add('opacity-0', 'translate-y-[-8px]');
                setTimeout(function() { toast.remove(); }, 300);
            }, 4500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        function switchMobileTab(tab) {
            window.activeMobileTab = tab;
            var panelSetup = document.getElementById('panelSetup');
            var panelTranscript = document.getElementById('panelTranscript');

            if (window.innerWidth >= 768) {
                if (panelSetup) panelSetup.style.display = 'flex';
                if (panelTranscript) panelTranscript.style.display = 'flex';
                return;
            }

            if (tab === 'setup') {
                if (panelSetup) panelSetup.style.display = 'flex';
                if (panelTranscript) panelTranscript.style.display = 'none';
            } else {
                if (panelSetup) panelSetup.style.display = 'none';
                if (panelTranscript) panelTranscript.style.display = 'flex';
                setStudioSubView(tab);
            }
        }

        function setStudioSubView(subView) {
            window.activeStudioSubView = subView;
            var viewTranscript = document.getElementById('transcriptView');
            var viewGrammar = document.getElementById('grammarView');
            var viewVocab = document.getElementById('vocabView');

            var btnTranscript = document.getElementById('navTabTranscript');
            var btnGrammar = document.getElementById('navTabGrammar');
            var btnVocab = document.getElementById('navTabVocab');

            if (viewTranscript) viewTranscript.classList.add('hidden');
            if (viewGrammar) viewGrammar.classList.add('hidden');
            if (viewVocab) {
                viewVocab.classList.add('hidden');
                viewVocab.classList.remove('flex');
            }

            [btnTranscript, btnGrammar, btnVocab].forEach(function(btn) {
                if (btn) btn.className = "no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 dark:text-slate-300 hover:bg-slate-200 transition flex items-center gap-1 shrink-0";
            });

            if (subView === 'transcript') {
                if (viewTranscript) viewTranscript.classList.remove('hidden');
                if (btnTranscript) btnTranscript.className = "no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-extrabold bg-red-600 text-white shadow-md transition flex items-center gap-1 shrink-0";
            } else if (subView === 'grammar') {
                if (viewGrammar) viewGrammar.classList.remove('hidden');
                if (btnGrammar) btnGrammar.className = "no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-extrabold bg-red-600 text-white shadow-md transition flex items-center gap-1 shrink-0";
                renderGrammarContainer();
            } else if (subView === 'vocab') {
                if (viewVocab) {
                    viewVocab.classList.remove('hidden');
                    viewVocab.classList.add('flex');
                }
                if (btnVocab) btnVocab.className = "no-wrap-tab px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-extrabold bg-red-600 text-white shadow-md transition flex items-center gap-1 shrink-0";
                renderVocabContainer();
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadHistoryFromStorage();
            initDropzoneEvents();
            if ('speechSynthesis' in window) window.speechSynthesis.getVoices();
        });
    </script>
</body>
</html>
