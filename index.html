<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuaraTeks ID - 高精度長尺 Pro</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        .rotate-y-180 { transform: rotateY(180deg); }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .word-clickable { cursor: pointer; border-bottom: 1px dotted #94a3b8; transition: all 0.2s; }
        .word-clickable:hover { color: #e70011; border-bottom-color: #e70011; background-color: rgba(231, 0, 17, 0.05); }
        .search-highlight { background-color: #fef08a; color: #854d0e; font-weight: bold; padding: 0 2px; border-radius: 2px; }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        indoRed: { 500: '#E70011', 600: '#C8000F', 700: '#A0000C' }
                    }
                }
            }
        };

        window.currentLoadedFile = null;
        window.currentAudioBase64 = null;
        window.transcriptBlocks = [];
        window.vocabList = [];
        window.activeMobileTab = 'setup';
        window.activeStudioSubView = 'transcript';
        window.activeVocabMode = 'card';
        window.activeVocabPosFilter = 'all';
        window.activeVocabSearchQuery = '';
        window.currentCardIndex = 0;
        window.isCardFlipped = false;
        window.isShuffled = false;
        window.shuffledVocabList = [];
        window.searchDebounceTimer = null;

        window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };

        window.handleFileChange = function(event) {
            var input = (event && event.target) ? event.target : document.getElementById('audioFileInput');
            var files = input ? input.files : null;
            if (!files || files.length === 0) return;

            var file = files[0];
            window.currentLoadedFile = file;

            var loadedName = document.getElementById('loadedFileName');
            if (loadedName) loadedName.textContent = file.name;

            var reader = new FileReader();
            reader.onload = function(e) {
                var dataUrl = e.target.result;
                window.currentAudioBase64 = dataUrl.split(',')[1];

                var audioPlayer = document.getElementById('audioPlayer');
                if (audioPlayer) {
                    audioPlayer.src = dataUrl;
                    audioPlayer.load();
                }

                var playerCard = document.getElementById('playerCard');
                if (playerCard) playerCard.classList.remove('opacity-60', 'pointer-events-none');

                showToast('「' + file.name + '」を読み込みました！', 'info');
            };
            reader.readAsDataURL(file);
        };

        async function fetchGeminiApi(apiKey, payload) {
            var modelName = 'gemini-3.6-flash';
            if (!payload.generationConfig) payload.generationConfig = {};
            payload.generationConfig.temperature = 0.1;

            var response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + modelName + ':generateContent?key=' + apiKey, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            var data = await response.json();
            if (!response.ok || data.error) {
                throw new Error(data.error?.message || ('HTTP Error ' + response.status));
            }
            return data;
        }

        window.processAudioWithGemini = async function() {
            if (!window.currentLoadedFile || !window.currentAudioBase64) {
                showToast('先に「音源選択」から音声ファイルを選択してください。', 'error');
                return;
            }

            var apiKey = getApiKey();
            if (!apiKey) {
                showToast('Gemini API Key が設定されていません。', 'error');
                openModal('apiKeyModal');
                return;
            }

            var btn = document.getElementById('startTranscribeBtn');
            var btnText = document.getElementById('transcribeBtnText');
            var progressContainer = document.getElementById('chunkProgressContainer');
            var progressLabel = document.getElementById('chunkProgressLabel');
            var progressPercent = document.getElementById('chunkProgressPercent');
            var progressBar = document.getElementById('chunkProgressBar');

            if (btn) btn.disabled = true;
            if (progressContainer) progressContainer.classList.remove('hidden');

            try {
                if (btnText) btnText.textContent = "Pass 1: 高精度文字起こし＆文法解剖中...";
                if (progressLabel) progressLabel.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-amber-500"></i> <span>【Pass 1/2】音声認識・対訳・文法解剖を実行中...</span>';
                if (progressBar) progressBar.style.width = '35%';
                if (progressPercent) progressPercent.textContent = '35%';

                var base64Data = window.currentAudioBase64;
                var mimeType = window.currentLoadedFile.type || 'audio/mp3';

                var transcribePrompt = `You are a world-class Indonesian verbatim transcription specialist and linguist.
Listen carefully to the entire audio file from absolute start to finish. Transcribe spoken Indonesian exactly as spoken with zero omissions.

For each phrase block, provide:
1. "speaker": Speaker identification (Pembicara 1, Pembicara 2, etc.)
2. "indonesian": Complete, verbatim spoken Indonesian text
3. "japanese": Precise Japanese translation
4. "grammarExplanation": Professional linguistic breakdown in Japanese:
   - 【構文】 Main/subordinate clauses, prepositions, conjunctions.
   - 【語根と派生】 Kata dasar and affix mechanics (me-, di-, ter-, -kan, -an).
   - 【ニュアンス】 Spoken context and nuance.

Return ONLY a valid JSON array matching this schema:
[
  {
    "speaker": "Pembicara 1",
    "indonesian": "exact spoken Indonesian",
    "japanese": "Japanese translation",
    "grammarExplanation": "【構文】...\n【語根と派生】...\n【ニュアンス】..."
  }
]`;

                var transcribePayload = {
                    contents: [{
                        role: 'user',
                        parts: [
                            { text: transcribePrompt },
                            { inlineData: { mimeType: mimeType, data: base64Data } }
                        ]
                    }],
                    generationConfig: { responseMimeType: "application/json" }
                };

                var transcribeData = await fetchGeminiApi(apiKey, transcribePayload);
                var transcriptRaw = transcribeData.candidates?.[0]?.content?.parts?.[0]?.text || '';
                transcriptRaw = transcriptRaw.trim().replace(/^```json/g, '').replace(/^```/g, '').replace(/```$/g, '').trim();
                var parsedTranscript = JSON.parse(transcriptRaw);
                var rawBlocks = Array.isArray(parsedTranscript) ? parsedTranscript : (parsedTranscript.transcript || []);

                if (!rawBlocks || rawBlocks.length === 0) {
                    throw new Error('音声からテキストが読み取れませんでした');
                }

                window.transcriptBlocks = rawBlocks.map(function(item, index) {
                    return {
                        id: 'block-' + Date.now() + '-' + index,
                        blockIndex: index,
                        speaker: item.speaker || 'Pembicara 1',
                        indonesian: item.indonesian || '',
                        japanese: item.japanese || '',
                        grammarExplanation: item.grammarExplanation || '構造解説なし'
                    };
                });

                if (btnText) btnText.textContent = "Pass 2: 全単語の網羅抽出・品詞分類中...";
                if (progressLabel) progressLabel.innerHTML = '<i class="fa-solid fa-book-open text-emerald-500"></i> <span>【Pass 2/2】全単語の品詞分解・単語帳生成中...</span>';
                if (progressBar) progressBar.style.width = '75%';
                if (progressPercent) progressPercent.textContent = '75%';

                await extractAllVocabWithPosPass2(apiKey);

                if (progressBar) progressBar.style.width = '100%';
                if (progressPercent) progressPercent.textContent = '100%';

                renderTranscriptContainer();
                renderGrammarContainer();
                renderVocabContainer();
                
                saveCurrentToHistory(window.currentLoadedFile.name, true);

                showToast('2Pass全自動精密解析が完了しました！', 'info');
                if (window.innerWidth < 768) {
                    switchMobileTab('transcript');
                }

            } catch (err) {
                console.error('Gemini API Process Error:', err);
                showToast('エラー: ' + (err.message || '解析処理に失敗しました'), 'error');
            } finally {
                if (btn) btn.disabled = false;
                if (btnText) btnText.textContent = "高精度解析を開始";
                setTimeout(function() { if (progressContainer) progressContainer.classList.add('hidden'); }, 1000);
            }
        };

        async function extractAllVocabWithPosPass2(apiKey) {
            if (!window.transcriptBlocks || window.transcriptBlocks.length === 0) return;

            var fullText = window.transcriptBlocks.map(function(b) { return b.indonesian; }).join(' ');
            var vocabPrompt = `Perform a comprehensive lexicographical analysis on the following Indonesian text.
Extract EVERY unique word without skipping, and categorize each into its exact Part of Speech (POS).

Categories (pos):
- "noun" (Kata Benda / 名詞)
- "verb" (Kata Kerja / 動詞)
- "adjective" (Kata Sifat / 形容詞)
- "adverb" (Kata Keterangan / 副詞)
- "other" (Prepositions, Conjunctions, Pronouns, Particles)

Rules:
1. Deduplicate words.
2. Provide dictionary root word (kata dasar).
3. Accurate Japanese context-aware translation.

Return ONLY a valid JSON array:
[
  {
    "indonesian": "word",
    "baseForm": "root word",
    "japanese": "Japanese meaning",
    "pos": "noun" | "verb" | "adjective" | "adverb" | "other",
    "context": "Short context phrase"
  }
]

Text:
${fullText}`;

            try {
                var vocabPayload = {
                    contents: [{ parts: [{ text: vocabPrompt }] }],
                    generationConfig: { responseMimeType: "application/json" }
                };

                var data = await fetchGeminiApi(apiKey, vocabPayload);
                var text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                text = text.trim().replace(/^```json/g, '').replace(/^```/g, '').replace(/```$/g, '').trim();
                var parsed = JSON.parse(text);

                if (Array.isArray(parsed) && parsed.length > 0) {
                    window.vocabList = parsed.map(function(v, i) {
                        return {
                            id: 'vocab-' + Date.now() + '-' + i,
                            indonesian: v.indonesian,
                            baseForm: v.baseForm || v.indonesian,
                            japanese: v.japanese || '',
                            pos: ['noun', 'verb', 'adjective', 'adverb', 'other'].includes(v.pos) ? v.pos : 'other',
                            context: v.context || '',
                            mastered: false
                        };
                    });
                } else {
                    window.vocabList = fallbackSimpleVocabList();
                }
            } catch (e) {
                console.warn('Vocab Parsing Failed, using fallback:', e);
                window.vocabList = fallbackSimpleVocabList();
            }
        }

        function fallbackSimpleVocabList() {
            var words = new Set();
            var list = [];
            window.transcriptBlocks.forEach(function(b) {
                var tokens = b.indonesian.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g, "").split(/\s+/);
                tokens.forEach(function(tok) {
                    var clean = tok.toLowerCase().trim();
                    if (clean.length > 2 && !words.has(clean)) {
                        words.add(clean);
                        list.push({
                            id: 'v-fallback-' + list.length,
                            indonesian: tok,
                            baseForm: tok,
                            japanese: '（要確認）',
                            pos: 'other',
                            context: b.indonesian,
                            mastered: false
                        });
                    }
                });
            });
            return list;
        }

        function renderClickableIndonesianWords(text, blockId) {
            if (!text) return '';
            var words = text.split(/\s+/);
            return words.map(function(w, idx) {
                var cleanWord = escapeHtml(w);
                return '<span class="word-clickable" onclick="speakFromWord(\'' + blockId + '\', ' + idx + ')" title="ここから再生">' + cleanWord + '</span>';
            }).join(' ');
        }

        function renderTranscriptContainer() {
            var emptyState = document.getElementById('emptyState');
            var container = document.getElementById('transcriptContainer');

            if (!window.transcriptBlocks || window.transcriptBlocks.length === 0) {
                emptyState?.classList.remove('hidden');
                if (container) container.innerHTML = '';
                var b = document.getElementById('statBlocks');
                var c = document.getElementById('statChars');
                if (b) b.textContent = '0';
                if (c) c.textContent = '0';
                return;
            }

            emptyState?.classList.add('hidden');
            var html = '';
            var totalChars = 0;

            window.transcriptBlocks.forEach(function(block) {
                totalChars += (block.indonesian ? block.indonesian.length : 0);
                var clickableIndo = renderClickableIndonesianWords(block.indonesian, 't-' + block.id);
                
                html += '<div id="card-t-' + block.id + '" class="bg-white dark:bg-slate-800 p-3 sm:p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-1.5">' +
                    '<div class="flex items-center justify-between text-xs text-slate-500 pb-1 border-b border-slate-100 dark:border-slate-700/60">' +
                        '<span class="font-bold text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-950/60 px-2 py-0.2 rounded-full text-[9px]">' +
                            '<i class="fa-solid fa-user text-[8px] mr-1"></i>' + escapeHtml(block.speaker) +
                        '</span>' +
                        '<div class="flex items-center gap-1.5">' +
                            '<button id="btn-toggle-t-' + block.id + '" onclick="toggleSpeechBlock(\'t-' + block.id + '\')" class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:text-red-500 text-[10px] font-bold transition flex items-center gap-1" title="再生/一時停止">' +
                                '<i class="fa-solid fa-play"></i><span>再生</span>' +
                            '</button>' +
                            '<button onclick="copyChunkText(\'' + escapeHtml(block.indonesian) + '\')" class="p-1 hover:text-red-500 text-slate-400 transition" title="テキストをコピー">' +
                                '<i class="fa-solid fa-copy text-xs"></i>' +
                            '</button>' +
                        '</div>' +
                    '</div>' +
                    '<p class="dynamic-text-indo font-extrabold text-slate-800 dark:text-slate-100">' + clickableIndo + '</p>' +
                    '<div class="bg-amber-50/70 dark:bg-slate-900/60 p-2 rounded-lg border border-amber-200/50 dark:border-amber-900/30">' +
                        '<p class="dynamic-text-ja font-semibold text-amber-900 dark:text-amber-200 flex items-start gap-1">' +
                            '<span class="text-[9px] bg-amber-200 dark:bg-amber-900/80 text-amber-800 dark:text-amber-300 px-1 rounded font-bold shrink-0 mt-0.5">訳</span>' +
                            '<span>' + escapeHtml(block.japanese) + '</span>' +
                        '</p>' +
                    '</div>' +
                '</div>';
            });

            if (container) container.innerHTML = html;
            var b = document.getElementById('statBlocks');
            var c = document.getElementById('statChars');
            if (b) b.textContent = window.transcriptBlocks.length;
            if (c) c.textContent = totalChars;
        }

        function renderGrammarContainer() {
            var emptyState = document.getElementById('grammarEmptyState');
            var container = document.getElementById('grammarContainer');

            if (!window.transcriptBlocks || window.transcriptBlocks.length === 0) {
                emptyState?.classList.remove('hidden');
                if (container) container.innerHTML = '';
                return;
            }

            emptyState?.classList.add('hidden');
            var html = '';

            window.transcriptBlocks.forEach(function(block, idx) {
                var clickableIndo = renderClickableIndonesianWords(block.indonesian, 'g-' + block.id);

                html += '<div id="card-g-' + block.id + '" class="bg-white dark:bg-slate-800 p-3 sm:p-3.5 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-2">' +
                    '<div class="flex items-center justify-between text-xs pb-1 border-b border-slate-100 dark:border-slate-700">' +
                        '<span class="font-bold text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/60 px-2 py-0.2 rounded-full text-[9px]">文節 #' + (idx + 1) + '</span>' +
                        '<div class="flex items-center gap-1.5">' +
                            '<span class="text-slate-400 text-[10px] font-bold mr-1">' + escapeHtml(block.speaker) + '</span>' +
                            '<button id="btn-toggle-g-' + block.id + '" onclick="toggleSpeechBlock(\'g-' + block.id + '\')" class="px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:text-blue-500 text-[10px] font-bold transition flex items-center gap-1" title="再生/一時停止">' +
                                '<i class="fa-solid fa-play"></i><span>再生</span>' +
                            '</button>' +
                        '</div>' +
                    '</div>' +
                    '<p class="dynamic-text-indo font-extrabold text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-slate-900 p-2 rounded border border-slate-200 dark:border-slate-700">' + clickableIndo + '</p>' +
                    '<div class="bg-blue-50/60 dark:bg-blue-950/30 p-2.5 rounded-lg border border-blue-200/60 dark:border-blue-900/40 text-xs leading-relaxed text-blue-950 dark:text-blue-200 space-y-1">' +
                        '<h5 class="font-bold text-blue-700 dark:text-blue-400 flex items-center gap-1 text-[10px] uppercase tracking-wider"><i class="fa-solid fa-diagram-project"></i> 精密構文・文法解説</h5>' +
                        '<div class="dynamic-text-ja whitespace-pre-line font-medium pt-0.5">' + escapeHtml(block.grammarExplanation) + '</div>' +
                    '</div>' +
                '</div>';
            });

            if (container) container.innerHTML = html;
        }

        function calculateSearchScore(item, query) {
            var q = query.toLowerCase().trim();
            if (!q) return 0;

            var indo = (item.indonesian || '').toLowerCase();
            var base = (item.baseForm || '').toLowerCase();
            var jap = (item.japanese || '').toLowerCase();
            var pos = getPosLabel(item.pos).toLowerCase();

            var score = 0;
            if (indo === q || base === q) score += 100;
            if (jap === q) score += 90;
            if (indo.startsWith(q) || base.startsWith(q)) score += 60;
            if (jap.startsWith(q)) score += 50;
            if (indo.includes(q) || base.includes(q)) score += 30;
            if (jap.includes(q)) score += 20;
            if (pos.includes(q)) score += 10;

            return score;
        }

        function getFilteredVocabList() {
            var filtered = window.isShuffled ? [...window.shuffledVocabList] : (window.vocabList || []);
            
            if (window.activeVocabPosFilter !== 'all') {
                filtered = filtered.filter(function(v) { return v.pos === window.activeVocabPosFilter; });
            }

            var query = (window.activeVocabSearchQuery || '').trim();
            if (query !== '') {
                var scoredList = filtered.map(function(item) {
                    return { item: item, score: calculateSearchScore(item, query) };
                }).filter(function(x) { return x.score > 0; });

                scoredList.sort(function(a, b) { return b.score - a.score; });
                filtered = scoredList.map(function(x) { return x.item; });
            }

            return filtered;
        }

        function onVocabSearchInput(val) {
            clearTimeout(window.searchDebounceTimer);
            window.searchDebounceTimer = setTimeout(function() {
                window.activeVocabSearchQuery = val || '';
                var clearBtn = document.getElementById('vocabSearchClearBtn');
                var suggContainer = document.getElementById('searchSuggestionsContainer');

                if (clearBtn) {
                    if (window.activeVocabSearchQuery.trim().length > 0) {
                        clearBtn.classList.remove('hidden');
                    } else {
                        clearBtn.classList.add('hidden');
                    }
                }

                var filtered = getFilteredVocabList();

                if (window.activeVocabSearchQuery.trim().length > 0 && filtered.length > 0) {
                    var suggHtml = '';
                    filtered.slice(0, 10).forEach(function(item) {
                        var hIndo = highlightSearchMatch(item.indonesian, window.activeVocabSearchQuery);
                        var hJap = highlightSearchMatch(item.japanese, window.activeVocabSearchQuery);
                        suggHtml += '<div onclick="selectWordForCardPractice(\'' + item.id + '\')" class="p-2.5 hover:bg-emerald-50 dark:hover:bg-slate-700 cursor-pointer flex items-center justify-between text-xs transition">' +
                            '<div class="truncate flex-1 pr-2">' +
                                '<span class="font-extrabold text-slate-800 dark:text-slate-100">' + hIndo + '</span>' +
                                '<span class="text-[10px] text-slate-400 ml-1">(' + getPosLabel(item.pos) + ')</span>' +
                            '</div>' +
                            '<span class="text-emerald-600 dark:text-emerald-400 font-bold truncate max-w-[130px] text-right">' + hJap + '</span>' +
                        '</div>';
                    });
                    if (suggContainer) {
                        suggContainer.innerHTML = suggHtml;
                        suggContainer.classList.remove('hidden');
                    }
                } else {
                    if (suggContainer) suggContainer.classList.add('hidden');
                }

                window.currentCardIndex = 0;
                renderVocabContainer();
            }, 100);
        }

        function selectWordForCardPractice(wordId) {
            var filtered = getFilteredVocabList();
            var targetIndex = filtered.findIndex(function(v) { return v.id === wordId; });

            if (targetIndex !== -1) {
                window.currentCardIndex = targetIndex;
            } else {
                window.currentCardIndex = 0;
            }

            var suggContainer = document.getElementById('searchSuggestionsContainer');
            if (suggContainer) suggContainer.classList.add('hidden');

            setVocabMode('card');
        }

        function clearVocabSearch() {
            var input = document.getElementById('vocabSearchInput');
            if (input) input.value = '';
            var suggContainer = document.getElementById('searchSuggestionsContainer');
            if (suggContainer) suggContainer.classList.add('hidden');
            onVocabSearchInput('');
        }

        function toggleShuffleCards() {
            window.isShuffled = !window.isShuffled;
            var btn = document.getElementById('shuffleCardsBtn');
            var label = document.getElementById('shuffleBtnLabel');

            if (window.isShuffled) {
                window.shuffledVocabList = [...window.vocabList].sort(function() { return Math.random() - 0.5; });
                if (btn) btn.className = "px-2 py-0.5 rounded-md bg-amber-500 text-white font-bold transition flex items-center gap-1 text-[11px] shadow";
                if (label) label.textContent = "ランダム中";
                showToast('単語カードをシャッフルしました！', 'info');
            } else {
                if (btn) btn.className = "px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 hover:bg-amber-100 dark:hover:bg-amber-950 text-slate-600 dark:text-slate-300 hover:text-amber-600 transition flex items-center gap-1 text-[11px]";
                if (label) label.textContent = "シャッフル";
                showToast('元の順番に戻しました', 'info');
            }

            window.currentCardIndex = 0;
            renderVocabContainer();
        }

        function highlightSearchMatch(str, query) {
            var raw = str || '';
            var safe = escapeHtml(raw);
            var q = (query || '').trim();
            if (!q) return safe;

            try {
                var escQuery = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                var regex = new RegExp('(' + escQuery + ')', 'gi');
                return safe.replace(regex, '<mark class="search-highlight">$1</mark>');
            } catch (e) {
                return safe;
            }
        }

        function renderVocabContainer() {
            var emptyState = document.getElementById('vocabEmptyState');
            var listContainer = document.getElementById('vocabListContainer');
            var cardContainer = document.getElementById('vocabCardContainer');
            var vocabBadge = document.getElementById('vocabCountBadge');

            var filtered = getFilteredVocabList();

            if (vocabBadge) vocabBadge.textContent = (window.vocabList || []).length;
            var statVocab = document.getElementById('statVocab');
            if (statVocab) statVocab.textContent = (window.vocabList || []).length;

            if (!filtered || filtered.length === 0) {
                emptyState?.classList.remove('hidden');
                if (listContainer) listContainer.innerHTML = '';
                cardContainer?.classList.add('hidden');
                return;
            }

                            '<p class="dynamic-text-ja text-emerald-700 dark:text-emerald-400 font-bold leading-tight">' + highlightedJap + '</p>' +
                            (v.context ? '<p class="dynamic-text-ja text-slate-500 italic truncate">"…' + highlightedCtx + '…"</p>' : '') +
                        '</div>' +
                        '<button onclick="toggleVocabMastered(\'' + v.id + '\')" class="px-2 py-0.5 rounded ' + (v.mastered ? 'bg-emerald-500 text-white' : 'bg-slate-100 dark:bg-slate-700 text-slate-400') + ' text-[10px] font-bold transition flex items-center gap-1 shrink-0">' +

                if (listContainer) listContainer.innerHTML = html;

        function updateFlashcardUI() {

            var item = filtered[window.currentCardIndex];

        function speakIndonesian(text) {
            if (!('speechSynthesis' in window)) {
                showToast('音声読み上げ非対応ブラウザです', 'error');
                return;
            }
            stopAllSpeech();

            var utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.rate = 0.85;

            var voices = window.speechSynthesis.getVoices();
            var indoVoice = voices.find(function(v) { return v.lang.startsWith('id') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium')); }) 
                           || voices.find(function(v) { return v.lang.startsWith('id'); });
            if (indoVoice) utterance.voice = indoVoice;

            window.speechSynthesis.speak(utterance);
        }

        function stopAllSpeech() {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            if (window.activeSpeechState.blockId) {
                updateBlockToggleUI(window.activeSpeechState.blockId, 'stopped');
            }
            window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };
        }

        function speakFromWord(blockId, wordIndex) {
            var cleanId = blockId.replace(/^[tg]-/, '');
            var block = window.transcriptBlocks.find(function(b) { return b.id === cleanId; });
            if (!block || !block.indonesian) return;

            var words = block.indonesian.split(/\s+/);
            var remainingText = words.slice(wordIndex).join(' ');
            
            startSpeechBlock(blockId, remainingText);
        }

        function toggleSpeechBlock(blockId) {
            if (!('speechSynthesis' in window)) return;

            if (window.activeSpeechState.blockId === blockId) {
                if (window.speechSynthesis.paused || window.activeSpeechState.isPaused) {
                    window.speechSynthesis.resume();
                    window.activeSpeechState.isPaused = false;
                    window.activeSpeechState.isPlaying = true;
                    updateBlockToggleUI(blockId, 'playing');
                } else if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.pause();
                    window.activeSpeechState.isPaused = true;
                    window.activeSpeechState.isPlaying = false;
                    updateBlockToggleUI(blockId, 'paused');
                } else {
                    startSpeechBlock(blockId);
                }
            } else {
                startSpeechBlock(blockId);
            }
        }

        function startSpeechBlock(blockId, customText) {
            if (customText === undefined) customText = null;
            if (!('speechSynthesis' in window)) return;

            stopAllSpeech();

            var cleanId = blockId.replace(/^[tg]-/, '');
            var block = window.transcriptBlocks.find(function(b) { return b.id === cleanId; });
            if (!block) return;

            var textToSpeak = customText || block.indonesian;
            var utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'id-ID';
            utterance.rate = 0.85;

            var voices = window.speechSynthesis.getVoices();
            var indoVoice = voices.find(function(v) { return v.lang.startsWith('id') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Premium')); }) 
                           || voices.find(function(v) { return v.lang.startsWith('id'); });
            if (indoVoice) utterance.voice = indoVoice;

            utterance.onstart = function() {
                window.activeSpeechState = { blockId: blockId, utterance: utterance, isPlaying: true, isPaused: false };
                updateBlockToggleUI(blockId, 'playing');
            };

            utterance.onpause = function() {
                window.activeSpeechState.isPaused = true;
                window.activeSpeechState.isPlaying = false;
                updateBlockToggleUI(blockId, 'paused');
            };

            utterance.onresume = function() {
                window.activeSpeechState.isPaused = false;
                window.activeSpeechState.isPlaying = true;
                updateBlockToggleUI(blockId, 'playing');
            };

            utterance.onend = function() {
                updateBlockToggleUI(blockId, 'stopped');
                window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };
            };

            utterance.onerror = function() {
                updateBlockToggleUI(blockId, 'stopped');
                window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };
            };

            window.speechSynthesis.speak(utterance);
        }

        function updateBlockToggleUI(blockId, state) {
            var btn = document.getElementById('btn-toggle-' + blockId);
            if (!btn) return;

            if (state === 'playing') {
                btn.innerHTML = '<i class="fa-solid fa-pause text-red-500"></i><span>一時停止</span>';
                btn.className = "px-2 py-0.5 rounded bg-red-50 dark:bg-red-950/60 text-red-600 dark:text-red-400 border border-red-200 dark:border-red-800 text-[10px] font-bold transition flex items-center gap-1 shadow-sm";
            } else if (state === 'paused') {
                btn.innerHTML = '<i class="fa-solid fa-play text-amber-500"></i><span>再開</span>';
                btn.className = "px-2 py-0.5 rounded bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-800 text-[10px] font-bold transition flex items-center gap-1 shadow-sm";
            } else {
                btn.innerHTML = '<i class="fa-solid fa-play"></i><span>再生</span>';
                btn.className = "px-2 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:text-red-500 text-[10px] font-bold transition flex items-center gap-1";
            }
        }

        function copyChunkText(text) {
            navigator.clipboard.writeText(text).then(function() {
                showToast('コピーしました', 'info');
            }).catch(function() {
                var textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showToast('コピーしました', 'info');
            });
        }

        function loadHistoryFromStorage() {
            try {
                var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
                renderHistoryList(history);
            } catch (e) {
                renderHistoryList([]);
            }

        function renderHistoryList(history) {
            var container = document.getElementById('historyList');
            if (!container) return;
            
            if (!history || history.length === 0) {
                container.innerHTML = '<p class="text-xs text-slate-400 py-1.5 text-center">履歴はありません (0/5)</p>';
                return;
            }

            var html = '';
            history.forEach(function(item) {
                html += '<div onclick="loadHistoryItem(\'' + item.id + '\')" class="p-2 rounded-lg bg-slate-50 dark:bg-slate-900/60 hover:bg-red-50 dark:hover:bg-red-950/40 border border-slate-200 dark:border-slate-700 transition cursor-pointer flex items-center justify-between gap-1.5">' +
                    '<div class="min-w-0 flex-1">' +
                        '<p class="text-xs font-bold text-slate-800 dark:text-slate-100 truncate leading-tight">' + escapeHtml(item.fileName) + '</p>' +
                        '<p class="text-[9px] text-slate-400 mt-0.5">' + escapeHtml(item.date) + ' / 文節:' + (item.blocks ? item.blocks.length : 0) + '件</p>' +
                    '</div>' +
                    '<button onclick="deleteHistoryItem(\'' + item.id + '\', event)" class="text-slate-400 hover:text-rose-500 p-1 shrink-0" title="削除">' +
                        '<i class="fa-solid fa-trash-can text-xs"></i>' +
                    '</button>' +
                '</div>';
            });

        }

        function saveCurrentToHistory(fileName, showToastNotification) {
            if (showToastNotification === undefined) showToastNotification = true;
            if (!window.transcriptBlocks || window.transcriptBlocks.length === 0) return;

            try {
                var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
                history = history.filter(function(h) { return h.fileName !== fileName; });

                var item = {
                    id: 'hist-' + Date.now(),
                    fileName: fileName || '音源解析データ',
                    date: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }),
                    blocks: window.transcriptBlocks,
                    vocab: window.vocabList
                };

                history.unshift(item);

                if (history.length >= 5) {
                    exportHistoryDataToFile(history, 'suarateks_5items_backup_' + new Date().toISOString().slice(0,10).replace(/-/g, '') + '.json');
                    history = [];
                    localStorage.removeItem('suarateks_history');
                    renderHistoryList([]);
                    if (showToastNotification) {
                        showToast('履歴が5件に達したため全保存（JSON出力）し、履歴をリセットしました', 'info');
                    }
                } else {
                    localStorage.setItem('suarateks_history', JSON.stringify(history));
                    renderHistoryList(history);
                    if (showToastNotification) {
                        showToast('履歴に保存しました (' + history.length + '/5件)', 'info');
                    }
                }
            } catch (e) {
                console.warn('LocalStorage Save Warning:', e);
            }
        }

        function exportHistoryDataToFile(dataArr, customFilename) {
            var dataStr = JSON.stringify(dataArr, null, 2);
            var blob = new Blob([dataStr], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            var dateStr = new Date().toISOString().slice(0,10).replace(/-/g, '');
            a.href = url;
            a.download = customFilename || ('suarateks_backup_' + dateStr + '.json');
            a.click();
            URL.revokeObjectURL(url);
        }

        function loadHistoryItem(id) {
            var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
            var found = history.find(function(h) { return h.id === id; });
            if (found) {
                window.transcriptBlocks = found.blocks || [];
                window.vocabList = found.vocab || [];
                renderTranscriptContainer();
                renderGrammarContainer();
                renderVocabContainer();
                var loadedName = document.getElementById('loadedFileName');
                if (loadedName) loadedName.textContent = found.fileName;
                showToast('「' + found.fileName + '」を読み込みました', 'info');
                if (window.innerWidth < 768) {
                    switchMobileTab('transcript');
                }
            }
        }

        function deleteHistoryItem(id, event) {
            event.stopPropagation();
            var history = JSON.parse(localStorage.getItem('suarateks_history') || '[]');
            history = history.filter(function(h) { return h.id !== id; });
            localStorage.setItem('suarateks_history', JSON.stringify(history));
            renderHistoryList(history);
            showToast('履歴を削除しました', 'info');
        }

            var val = document.getElementById('apiKeyInput')?.value.trim() || '';
            if (val) {
                localStorage.setItem('suarateks_gemini_key', val);
                showToast('API Key を保存しました！', 'info');
            } else {
                localStorage.removeItem('suarateks_gemini_key');
                showToast('API Key をクリアしました', 'info');
            }
            closeModal('apiKeyModal');
        }

        function showToast(message, type) {
            if (type === undefined) type = 'info';
            var container = document.getElementById('toastContainer');
            if (!container) return;
            var toast = document.createElement('div');
            var bgColor = type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
            var icon = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';

            toast.className = bgColor + ' text-white px-3 py-2 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto border border-white/10';
            toast.innerHTML = '<i class="fa-solid ' + icon + ' text-amber-400 text-sm"></i> <span>' + escapeHtml(message) + '</span>';

            container.appendChild(toast);
            setTimeout(function() { toast.classList.remove('translate-y-2', 'opacity-0'); }, 10);
            setTimeout(function() {
                toast.classList.add('opacity-0', 'translate-y-[-8px]');
                setTimeout(function() { toast.remove(); }, 300);
            }, 3500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        document.addEventListener('DOMContentLoaded', function() {
            loadSavedApiKey();
            loadHistoryFromStorage();
        });
    </script>
</head>
