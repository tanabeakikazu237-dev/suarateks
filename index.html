<script>
/* =========================================================
   Gemini API
   ========================================================= */

async function fetchGeminiApi(apiKey, payload) {
    var cleanKey = String(apiKey || getApiKey() || '').trim();

    if (!cleanKey) {
        throw new Error('API Keyが設定されていません。');
    }

    /*
     * Gemini API endpoint
     *
     * IMPORTANT:
     * Markdownリンク形式を絶対に入れない。
     *
     * NG:
     * '[https://...](https://...)'
     *
     * OK:
     * 'https://...'
     */
    var targetUrl =
        'https://generativelanguage.googleapis.com/v1beta/models/' +
        'gemini-2.5-flash:generateContent';

    /*
     * payloadが壊れていても落ちにくくする
     */
    if (!payload || typeof payload !== 'object') {
        throw new Error('Gemini APIに送信するデータが不正です。');
    }

    /*
     * generationConfig
     */
    if (!payload.generationConfig) {
        payload.generationConfig = {};
    }

    /*
     * JSONレスポンスを要求
     */
    payload.generationConfig.temperature = 0.1;
    payload.generationConfig.responseMimeType = 'application/json';

    /*
     * デバッグ情報
     *
     * APIキーそのものは表示しない
     */
    console.log('========== Gemini Request ==========');
    console.log('Method:', 'POST');
    console.log('URL:', targetUrl);
    console.log('Payload:', payload);
    console.log('====================================');

    var response;

    try {
        response = await fetch(targetUrl, {
            method: 'POST',

            headers: {
                'Content-Type': 'application/json',
                'x-goog-api-key': cleanKey
            },

            body: JSON.stringify(payload)
        });

    } catch (error) {

        console.error('Gemini fetch error:', error);

        throw new Error(
            'Gemini APIへの接続に失敗しました。\n' +
            'ブラウザのCORSまたはネットワークエラーの可能性があります。\n\n' +
            '詳細: ' + (error && error.message
                ? error.message
                : String(error))
        );
    }

    /*
     * HTTP情報を必ず確認
     */
    console.log('========== Gemini Response ==========');
    console.log('HTTP Status:', response.status);
    console.log('HTTP Status Text:', response.statusText);
    console.log('Response URL:', response.url);
    console.log('=====================================');

    /*
     * response.text() を先に使う。
     * JSONでないエラーレスポンスにも対応するため。
     */
    var responseText = '';

    try {
        responseText = await response.text();
    } catch (error) {
        throw new Error(
            'Gemini APIのレスポンスを読み取れませんでした: ' +
            error.message
        );
    }

    console.log('Gemini Raw Response:', responseText);

    /*
     * JSON解析
     */
    var data = null;

    if (responseText) {
        try {
            data = JSON.parse(responseText);
        } catch (error) {

            console.error(
                'Gemini response is not JSON:',
                responseText
            );

            if (!response.ok) {
                throw new Error(
                    'Gemini API Error: HTTP ' +
                    response.status +
                    ' ' +
                    response.statusText +
                    '\n\n' +
                    responseText.substring(0, 1000)
                );
            }

            throw new Error(
                'Gemini APIからJSONではない応答が返りました。\n' +
                'HTTP ' + response.status
            );
        }
    }

    /*
     * HTTPエラー
     */
    if (!response.ok) {

        console.error('========== Gemini API Error ==========');
        console.error('Status:', response.status);
        console.error('Status Text:', response.statusText);
        console.error('URL:', response.url);
        console.error('Response:', data);
        console.error('Raw:', responseText);
        console.error('======================================');

        var errorMessage = '';

        if (
            data &&
            data.error &&
            data.error.message
        ) {
            errorMessage = data.error.message;
        }

        /*
         * 405
         */
        if (response.status === 405) {

            throw new Error(
                'HTTP 405 Method Not Allowed\n\n' +
                'Gemini APIがこのHTTPメソッドを受け付けていません。\n\n' +
                '確認してください:\n' +
                '・Request URLが正しいか\n' +
                '・POSTで送信されているか\n' +
                '・ブラウザのNetworkタブでOPTIONSが405になっていないか\n\n' +
                'Request URL:\n' +
                targetUrl +
                (errorMessage
                    ? '\n\nGeminiからのメッセージ:\n' +
                      errorMessage
                    : '')
            );
        }

        /*
         * 400
         */
        if (response.status === 400) {

            throw new Error(
                'HTTP 400 Bad Request\n\n' +
                'Gemini APIへの送信データが不正です。\n\n' +
                (errorMessage ||
                    'Payloadの形式、model、contents、generationConfigなどを確認してください。')
            );
        }

        /*
         * 401 / 403
         */
        if (
            response.status === 401 ||
            response.status === 403
        ) {

            throw new Error(
                'HTTP ' + response.status + '\n\n' +
                'API Keyが無効、期限切れ、またはこのAPIへのアクセス権がありません。\n\n' +
                (errorMessage || '')
            );
        }

        /*
         * 404
         */
        if (response.status === 404) {

            throw new Error(
                'HTTP 404 Not Found\n\n' +
                '指定したGeminiモデル/APIエンドポイントが見つかりません。\n\n' +
                'Model:\n' +
                'gemini-2.5-flash\n\n' +
                (errorMessage || '')
            );
        }

        /*
         * 429
         */
        if (response.status === 429) {

            throw new Error(
                'HTTP 429 Too Many Requests\n\n' +
                'Gemini APIの利用制限またはレート制限に達した可能性があります。\n\n' +
                (errorMessage || '')
            );
        }

        /*
         * 500系
         */
        if (response.status >= 500) {

            throw new Error(
                'Gemini API Server Error: HTTP ' +
                response.status +
                '\n\n' +
                (errorMessage ||
                    'Gemini側で一時的なエラーが発生しています。')
            );
        }

        /*
         * その他
         */
        throw new Error(
            'Gemini API Error: HTTP ' +
            response.status +
            ' ' +
            response.statusText +
            '\n\n' +
            (errorMessage ||
                responseText.substring(0, 1000))
        );
    }

    /*
     * 正常なのにdataが空
     */
    if (!data) {
        throw new Error(
            'Gemini APIから空のレスポンスが返りました。'
        );
    }

    /*
     * Gemini側でブロックされた場合
     */
    if (
        data.promptFeedback &&
        data.promptFeedback.blockReason
    ) {

        throw new Error(
            'Geminiによりリクエストがブロックされました: ' +
            data.promptFeedback.blockReason
        );
    }

    /*
     * candidatesが存在するか確認
     */
    if (
        !data.candidates ||
        !Array.isArray(data.candidates) ||
        data.candidates.length === 0
    ) {

        console.error(
            'Gemini response has no candidates:',
            data
        );

        throw new Error(
            'Geminiから候補応答が返ってきませんでした。'
        );
    }

    console.log('Gemini parsed response:', data);

    return data;
}


/* =========================================================
   Geminiレスポンスからテキストを取り出す
   ========================================================= */

function extractGeminiText(data) {

    if (!data) {
        throw new Error(
            'Geminiレスポンスが空です。'
        );
    }

    /*
     * candidates
     */
    var candidate =
        data.candidates &&
        data.candidates[0];

    if (!candidate) {

        var blockReason =
            data.promptFeedback &&
            data.promptFeedback.blockReason;

        if (blockReason) {
            throw new Error(
                'Geminiによりブロックされました: ' +
                blockReason
            );
        }

        throw new Error(
            'Geminiの候補応答がありません。'
        );
    }

    /*
     * finishReason
     */
    if (
        candidate.finishReason &&
        candidate.finishReason !== 'STOP' &&
        candidate.finishReason !== 'MAX_TOKENS'
    ) {

        console.warn(
            'Gemini finishReason:',
            candidate.finishReason
        );
    }

    /*
     * parts
     */
    var parts =
        candidate.content &&
        candidate.content.parts;

    if (
        !parts ||
        !Array.isArray(parts)
    ) {

        console.error(
            'Invalid Gemini candidate:',
            candidate
        );

        throw new Error(
            'Gemini応答にテキストデータがありません。'
        );
    }

    /*
     * 複数partsを結合
     */
    var text = parts
        .map(function(part) {
            return part && part.text
                ? part.text
                : '';
        })
        .join('')
        .trim();

    if (!text) {

        throw new Error(
            'Geminiが空の応答を返しました。'
        );
    }

    return text;
}


/* =========================================================
   Gemini JSONレスポンスを安全に解析
   ========================================================= */

function parseGeminiJson(data) {

    var text = extractGeminiText(data);

    /*
     * ```json ... ``` を除去
     */
    text = text
        .replace(/^```json\s*/i, '')
        .replace(/^```\s*/i, '')
        .replace(/\s*```$/i, '')
        .trim();

    /*
     * そのままJSON
     */
    try {
        return JSON.parse(text);
    } catch (error) {
        console.warn(
            '通常のJSON.parseに失敗:',
            error
        );
    }

    /*
     * JSONの前後に余計な文字がある場合
     */
    var firstObject = text.indexOf('{');
    var lastObject = text.lastIndexOf('}');

    if (
        firstObject !== -1 &&
        lastObject !== -1 &&
        lastObject > firstObject
    ) {

        var objectText =
            text.substring(
                firstObject,
                lastObject + 1
            );

        try {
            return JSON.parse(objectText);
        } catch (error) {
            console.warn(
                'Object JSON parse failed:',
                error
            );
        }
    }

    /*
     * 配列
     */
    var firstArray = text.indexOf('[');
    var lastArray = text.lastIndexOf(']');

    if (
        firstArray !== -1 &&
        lastArray !== -1 &&
        lastArray > firstArray
    ) {

        var arrayText =
            text.substring(
                firstArray,
                lastArray + 1
            );

        try {
            return JSON.parse(arrayText);
        } catch (error) {
            console.warn(
                'Array JSON parse failed:',
                error
            );
        }
    }

    /*
     * 解析不能
     */
    console.error(
        'Gemini JSON parse failed. Raw text:',
        text
    );

    throw new Error(
        'GeminiのJSONを解析できませんでした。\n\n' +
        'Geminiの返答:\n' +
        text.substring(0, 2000)
    );
}


/* =========================================================
   API Key
   ========================================================= */

function getApiKey() {

    try {
        return (
            localStorage.getItem(
                'suarateks_gemini_api_key'
            ) || ''
        ).trim();

    } catch (error) {

        console.warn(
            'API Keyの取得に失敗:',
            error
        );

        return '';
    }
}


function saveApiKey(apiKey) {

    var key =
        String(apiKey || '').trim();

    if (!key) {
        throw new Error(
            'API Keyが空です。'
        );
    }

    try {

        localStorage.setItem(
            'suarateks_gemini_api_key',
            key
        );

    } catch (error) {

        throw new Error(
            'API Keyを保存できませんでした: ' +
            error.message
        );
    }
}


/* =========================================================
   Audio MIME Type
   ========================================================= */

function getAudioMimeType(file) {

    if (
        file &&
        file.type &&
        String(file.type).trim()
    ) {
        return String(file.type).trim();
    }

    var name =
        String(
            file && file.name
                ? file.name
                : ''
        ).toLowerCase();

    if (name.endsWith('.mp3')) {
        return 'audio/mpeg';
    }

    if (name.endsWith('.wav')) {
        return 'audio/wav';
    }

    if (name.endsWith('.m4a')) {
        return 'audio/mp4';
    }

    if (name.endsWith('.aac')) {
        return 'audio/aac';
    }

    if (name.endsWith('.ogg')) {
        return 'audio/ogg';
    }

    if (name.endsWith('.flac')) {
        return 'audio/flac';
    }

    if (name.endsWith('.webm')) {
        return 'audio/webm';
    }

    return 'audio/mpeg';
}


/* =========================================================
   File → Base64
   ========================================================= */

function fileToBase64(file) {

    return new Promise(function(resolve, reject) {

        if (!file) {
            reject(
                new Error('音声ファイルがありません。')
            );
            return;
        }

        var reader =
            new FileReader();

        reader.onload = function() {

            try {

                var result =
                    String(reader.result || '');

                var comma =
                    result.indexOf(',');

                if (comma === -1) {
                    reject(
                        new Error(
                            '音声ファイルのBase64変換に失敗しました。'
                        )
                    );
                    return;
                }

                resolve(
                    result.substring(
                        comma + 1
                    )
                );

            } catch (error) {

                reject(error);
            }
        };

        reader.onerror = function() {

            reject(
                new Error(
                    'ファイル読み込みに失敗しました。'
                )
            );
        };

        reader.readAsDataURL(file);
    });
}


/* =========================================================
   HTML Escape
   ========================================================= */

function escapeHtml(value) {

    return String(value == null ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}


/* =========================================================
   JavaScript String Escape
   ========================================================= */

function escapeJsString(value) {

    return String(value == null ? '' : value)
        .replace(/\\/g, '\\\\')
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\r/g, '\\r')
        .replace(/\n/g, '\\n')
        .replace(/<\/script/gi, '<\\/script');
}


/* =========================================================
   File Size
   ========================================================= */

function formatBytes(bytes) {

    bytes = Number(bytes) || 0;

    if (bytes === 0) {
        return '0 Bytes';
    }

    var k = 1024;

    var sizes = [
        'Bytes',
        'KB',
        'MB',
        'GB',
        'TB'
    ];

    var i =
        Math.floor(
            Math.log(bytes) /
            Math.log(k)
        );

    i =
        Math.max(
            0,
            Math.min(
                i,
                sizes.length - 1
            )
        );

    return (
        parseFloat(
            (
                bytes /
                Math.pow(k, i)
            ).toFixed(1)
        ) +
        ' ' +
        sizes[i]
    );
}


/* =========================================================
   Gemini APIを使う例
   ========================================================= */

async function transcribeAudioWithGemini(
    file,
    apiKey
) {

    if (!file) {
        throw new Error(
            '音声ファイルが選択されていません。'
        );
    }

    var mimeType =
        getAudioMimeType(file);

    var base64 =
        await fileToBase64(file);

    var payload = {

        contents: [
            {
                role: 'user',

                parts: [

                    {
                        text:
                            'この音声を正確に文字起こししてください。' +
                            '聞き取れない部分は推測せず、可能な範囲で正確に記録してください。' +
                            'JSONのみを返してください。'
                    },

                    {
                        inlineData: {
                            mimeType: mimeType,
                            data: base64
                        }
                    }

                ]
            }
        ],

        generationConfig: {

            temperature: 0.1,

            responseMimeType:
                'application/json',

            maxOutputTokens:
                8192
        }
    };

    var data =
        await fetchGeminiApi(
            apiKey,
            payload
        );

    return parseGeminiJson(data);
}

   Gemini API: 文法解析
   ========================================================= */

        throw new Error(
            '文法解析するテキストがありません。'
        );
    }

    var payload = {

        contents: [
            {
                role: 'user',

                parts: [
                    {
                        text:
                            '以下のインドネシア語について文法解析してください。\n\n' +
                            input +
                            '\n\n' +
                            'JSON形式のみで回答してください。'
                    }
                ]
            }
        ],

        generationConfig: {

            temperature: 0.1,

            responseMimeType:
                'application/json',

            maxOutputTokens:
                4096
        }
    };

    var data =
        await fetchGeminiApi(
            apiKey,
            payload
        );

    return parseGeminiJson(data);
}

/* =========================================================
   読み上げ
   ========================================================= */

function speakIndonesian(text) {

    var value =
        String(text || '').trim();

    if (!value) {
        return;
    }

    if (
        !('speechSynthesis' in window)
    ) {
        alert(
            'このブラウザは音声読み上げに対応していません。'
        );
        return;
    }

    window.speechSynthesis.cancel();

    var utterance =
        new SpeechSynthesisUtterance(value);

    utterance.lang = 'id-ID';

    utterance.rate = 0.9;

    utterance.pitch = 1.0;

    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================================================
   Gemini Error表示
   ========================================================= */

function showGeminiError(error) {

    var message =
        error && error.message
            ? error.message
            : String(error);

    console.error(
        'Gemini Error:',
        error
    );

    /*
     * 既存のエラー表示要素がある場合
     */
    var errorBox =
        document.getElementById(
            'errorMessage'
        );

    if (errorBox) {

        errorBox.textContent =
            message;

        errorBox.style.display =
            'block';

        return;
    }

    /*
     * なければalert
     */
    alert(message);
}
</script>
