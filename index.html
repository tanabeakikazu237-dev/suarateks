<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SuaraTeks ID - 高精度長尺 Pro</title>

    <!-- PWA Web App化設定 -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SuaraTeks">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2991/2991148.png">

    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root { --transcript-font-size: 20px; }
        .dynamic-text-indo { font-size: var(--transcript-font-size, 20px); line-height: 1.4; }
        .dynamic-text-ja { font-size: calc(var(--transcript-font-size, 20px) * 0.75); line-height: 1.4; }
        
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .backface-hidden { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }

        .word-clickable { cursor: pointer; border-bottom: 1.5px dotted #94a3b8; transition: all 0.15s; display: inline-block; }
        .word-clickable:hover { color: #e70011; border-bottom-color: #e70011; background-color: rgba(231, 0, 17, 0.08); border-radius: 2px; }
        .search-highlight { background-color: #fef08a; color: #854d0e; font-weight: bold; padding: 0 2px; border-radius: 2px; }

        .dropzone-active { border-color: #e70011 !important; background-color: rgba(231, 0, 17, 0.05) !important; }
        .no-wrap-tab { whitespace: nowrap !important; word-break: keep-all !important; flex-shrink: 0 !important; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: { indoRed: { 500: '#E70011', 600: '#C8000F', 700: '#A0000C' } }
                }
            }
        };

        window.currentLoadedFile = null;
        window.currentAudioBase64 = null;
        window.transcriptBlocks = [];
        window.vocabList = [];
        window.activeMobileTab = 'setup';
        window.activeStudioSubView = 'transcript';
        window.activeVocabMode = 'card';
        window.activeVocabPosFilter = 'all';
        window.activeVocabSearchQuery = '';
        window.currentCardIndex = 0;
        window.isCardFlipped = false;
        window.isShuffled = false;
        window.shuffledVocabList = [];
        window.selectedHistoryIds = [];

        window.activeSpeechState = { blockId: null, utterance: null, isPlaying: false, isPaused: false };

        window.handleFileChange = function(event) {
            var input = (event && event.target) ? event.target : document.getElementById('audioFileInput');
            var files = input ? input.files : null;
            if (!files || files.length === 0) return;
            processSelectedFile(files[0]);
        };

        function processSelectedFile(file) {
            window.currentLoadedFile = file;
            var dropzoneDefault = document.getElementById('dropzoneDefault');
            var dropzoneSelected = document.getElementById('dropzoneSelected');
            var selectedFileName = document.getElementById('selectedFileName');
            var selectedFileSize = document.getElementById('selectedFileSize');

            if (dropzoneDefault) dropzoneDefault.classList.add('hidden');
            if (dropzoneSelected) dropzoneSelected.classList.remove('hidden');
            if (selectedFileName) selectedFileName.textContent = file.name;
            if (selectedFileSize) selectedFileSize.textContent = formatBytes(file.size);

            var reader = new FileReader();
            reader.onload = function(e) {
                var dataUrl = e.target.result;
                window.currentAudioBase64 = dataUrl.split(',')[1];
                var audioPlayer = document.getElementById('audioPlayer');
                if (audioPlayer) { audioPlayer.src = dataUrl; audioPlayer.load(); }
                showToast('「' + file.name + '」を読み込みました！', 'info');
            };
            reader.readAsDataURL(file);
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            var k = 1024, sizes = ['Bytes', 'KB', 'MB', 'GB'];
            var i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function initDropzoneEvents() {
            var label = document.getElementById('fileDropLabel');
            if (!label) return;
            ['dragenter', 'dragover'].forEach(function(eventName) {
                label.addEventListener(eventName, function(e) { e.preventDefault(); e.stopPropagation(); label.classList.add('dropzone-active'); }, false);
            });
            ['dragleave', 'drop'].forEach(function(eventName) {
                label.addEventListener(eventName, function(e) { e.preventDefault(); e.stopPropagation(); label.classList.remove('dropzone-active'); }, false);
            });
            label.addEventListener('drop', function(e) {
                var dt = e.dataTransfer;
                var files = dt.files;
                if (files && files.length > 0) {
                    var input = document.getElementById('audioFileInput');
                    if (input) input.files = files;
                    processSelectedFile(files[0]);
                }
            }, false);
        }

        async function fetchGeminiApi(apiKey, payload) {
            var modelName = 'gemini-3.6-flash';
            if (!payload.generationConfig) payload.generationConfig = {};
            payload.generationConfig.temperature = 0.1;

            var response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + modelName + ':generateContent?key=' + apiKey, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            var data = await response.json();
            if (!response.ok || data.error) throw new Error(data.error?.message || ('HTTP Error ' + response.status));
            return data;
        }

        window.processAudioWithGemini = async function() {
            if (!window.currentLoadedFile || !window.currentAudioBase64) {
                showToast('先に音源ファイルを選択してください。', 'error');
                return;
            }

            var apiKey = getApiKey();
            if (!apiKey) {
                showToast('Gemini API Key が設定されていません。', 'error');
                openModal('apiKeyModal');
                return;
            }

            var btn = document.getElementById('startTranscribeBtn');
            var btnText = document.getElementById('transcribeBtnText');
            var progressContainer = document.getElementById('chunkProgressContainer');
            var progressLabel = document.getElementById('chunkProgressLabel');
            var progressPercent = document.getElementById('chunkProgressPercent');
            var progressBar = document.getElementById('chunkProgressBar');

            if (btn) btn.disabled = true;
            if (progressContainer) progressContainer.classList.remove('hidden');

            try {
                if (btnText) btnText.textContent = "Pass 1: 文字起こし＆文法解剖中...";
                if (progressLabel) progressLabel.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-amber-500"></i> <span>【Pass 1/2】音声認識・対訳・文法解剖...</span>';
                if (progressBar) progressBar.style.width = '35%';
                if (progressPercent) progressPercent.textContent = '35%';

                var base64Data = window.currentAudioBase64;
                var mimeType = window.currentLoadedFile.type || 'audio/mp3';

                var transcribePrompt = `You are a world-class Indonesian verbatim transcription specialist and linguist.
Listen carefully to the entire audio file from absolute start to finish. Transcribe spoken Indonesian exactly as spoken with zero omissions.

For each phrase block, provide:
1. "speaker": Speaker identification (Pembicara 1, Pembicara 2, etc.)
2. "indonesian": Complete, verbatim spoken Indonesian text
3. "japanese": Precise Japanese translation
4. "grammarExplanation": Professional linguistic breakdown in Japanese:
   - 【構文】 Main/subordinate clauses, prepositions, conjunctions.
   - 【語根と派生】 Kata dasar and affix mechanics (me-, di-, ter-, -kan, -an).
   - 【ニュアンス】 Spoken context and nuance.

Return ONLY a valid JSON array matching this schema:
[
  {
    "speaker": "Pembicara 1",
    "indonesian": "exact spoken Indonesian",
    "japanese": "Japanese translation",
    "grammarExplanation": "【構文】...\n【語根と派生】...\n【ニュアンス】..."
  }
]`;

                var transcribePayload = {
                    contents: [{ role: 'user', parts: [{ text: transcribePrompt }, { inlineData: { mimeType: mimeType, data: base64Data } }] }],
                    generationConfig: { responseMimeType: "application/json" }
                };

                var transcribeData = await fetchGeminiApi(apiKey, transcribePayload);
                var transcriptRaw = transcribeData.candidates?.[0]?.content?.parts?.[0]?.text || '';
                transcriptRaw = transcriptRaw.trim().replace(/^```json/g, '').replace(/^```/g, '').replace(/```$/g, '').trim();
                var parsedTranscript = JSON.parse(transcriptRaw);
                var rawBlocks = Array.isArray(parsedTranscript) ? parsedTranscript : (parsedTranscript.transcript || []);

                if (!rawBlocks || rawBlocks.length === 0) throw new Error('音声からテキストが読み取れませんでした');

                window.transcriptBlocks = rawBlocks.map(function(item, index) {
                    return {
                        id: 'block-' + Date.now() + '-' + index,
                        blockIndex: index,
                        speaker: item.speaker || 'Pembicara 1',
                        indonesian: item.indonesian || '',
                        japanese: item.japanese || '',
                        grammarExplanation: item.grammarExplanation || '構造解説なし'
                    };
                });

                if (btnText) btnText.textContent = "Pass 2: 全単語網羅抽出中...";
                if (progressLabel) progressLabel.innerHTML = '<i class="fa-solid fa-book-open text-emerald-500"></i> <span>【Pass 2/2】品詞分解・単語帳生成...</span>';
                if (progressBar) progressBar.style.width = '75%';
                if (progressPercent) progressPercent.textContent = '75%';

                await extractAllVocabWithPosPass2(apiKey);

                if (progressBar) progressBar.style.width = '100%';
                if (progressPercent) progressPercent.textContent = '100%';

                renderTranscriptContainer();
                renderGrammarContainer();
                renderVocabContainer();
                
                saveCurrentToHistory(window.currentLoadedFile.name, true);
                showToast('2Pass全自動精密解析が完了しました！', 'info');
                if (window.innerWidth < 768) switchMobileTab('transcript');

            } catch (err) {
                console.error('Gemini API Process Error:', err);
                showToast('エラー: ' + (err.message || '解析処理に失敗しました'), 'error');
            } finally {
                if (btn) btn.disabled = false;
                if (btnText) btnText.textContent = "高精度解析を開始";
                setTimeout(function() { if (progressContainer) progressContainer.classList.add('hidden'); }, 1000);
            }
        };

        async function extractAllVocabWithPosPass2(apiKey) {
            if (!window.transcriptBlocks || window.transcriptBlocks.length === 0) return;
            var fullText = window.transcriptBlocks.map(function(b) { return b.indonesian; }).join(' ');
            var vocabPrompt = `Perform a comprehensive lexicographical analysis on the following Indonesian text.
Extract EVERY unique word without skipping, and categorize each into its exact Part of Speech (POS).

Categories (pos): "noun", "verb", "adjective", "adverb", "other"

Return ONLY a valid JSON array:
[
  {
    "indonesian": "word",
    "baseForm": "root word",
    "japanese": "Japanese meaning",
    "pos": "noun" | "verb" | "adjective" | "adverb" | "other",
    "context": "Short context phrase"
  }
]
Text: ${fullText}`;

            try {
                var vocabPayload = { contents: [{ parts: [{ text: vocabPrompt }] }], generationConfig: { responseMimeType: "application/json" } };
                var data = await fetchGeminiApi(apiKey, vocabPayload);
                var text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
                text = text.trim().replace(/^```json/g, '').replace(/^
